name: Theme Readability Certification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Light and dark (darkModeCertification.mjs), then Windows' contrast themes: every certified student and teacher scene
  # under forced colours, dark and light (forcedColorsCertification.mjs, after its self-test). The forced-colours walk
  # (340 readings) took thirteen minutes on a shared four-core machine (2026-11-08); the limit was 40 minutes before it.
  browser-readability:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start theme certification harness
        run: |
          npx vite --host 127.0.0.1 --port 5199 --strictPort >/tmp/theme-vite.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:5199/tests/browser/workViewCertification.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/theme-vite.log; exit 1
      # The real app in memory (firebase/* faked, synthetic school): the
      # teacher and student surfaces Part 2 of the certification audits.
      - name: Start the in-memory app harness
        run: |
          npx vite --config tests/browser/teacherWorkflow/vite.config.mjs >/tmp/teacher-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/teacher-harness.log; exit 1
      - name: Certify light and dark readability
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: npm run certify:dark-mode
      # The certified scenes' standalone harnesses (assignment tools, the secure exam, the exam-practice chip) with their
      # services stubbed, as the accessibility certification serves them, under a dependency cache of their own: the
      # plain server on 5199 shares node_modules/.vite, and two servers on one cache reload each other's pages.
      - name: Start the stubbed harness server for the forced-colours walk
        if: ${{ !cancelled() }}
        run: |
          npx vite --config tests/browser/forcedColors.vite.config.mjs --host 127.0.0.1 --port 5198 --strictPort >/tmp/forced-colors-vite.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:5198/tests/browser/accessibilitySecureExam.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/forced-colors-vite.log; exit 1
      # The walk counts nothing unless it can be seen finding something: a focus ring that is a shadow, a selected tab
      # that is only a fill, a button whose edge is its fill, each beside its fixed twin (no server: the pages are its own).
      - name: The forced-colours walk finds each planted defect
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/forcedColorsSelfTest.mjs
      # Windows' contrast themes: every certified scene at 1366x768 and 390x844, read under forced colours in a dark
      # contrast theme and a light one. Fails a Tab stop that draws no focus indicator, a selected or pressed control
      # shown only by colour or background, and a control that lost its edge (src/theme/forcedColors.css).
      - name: Certify the certified scenes under forced colours, dark and light
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5198"
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: node tests/browser/forcedColorsCertification.mjs
      - name: Keep the certification screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dark-mode-certification
          path: tests/browser/artifacts/darkMode
          retention-days: 14
      - name: Keep the forced-colours report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forced-colors-certification
          path: tests/browser/artifacts/forcedColors
          retention-days: 14
