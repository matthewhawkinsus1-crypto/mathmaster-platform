name: Temporary Apply Per-Section Review Patch

on:
  push:
    branches:
      - fix/per-section-classroom-posts

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/per-section-classroom-posts
          fetch-depth: 0
      - name: Apply focused review patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/teacher/LessonPreflightModal.jsx')
          text = path.read_text()

          replacements = [
              (
                  """    publicationStrategy: PUBLICATION_STRATEGIES.HYBRID,\n    includeWarmupInClassroom: false,\n    homeworkDueAt: '',\n    ...rest,\n    assignedClassPeriods: Array.isArray(assignedClassPeriods) ? [...assignedClassPeriods] : [],\n""",
                  """    homeworkDueAt: '',\n    ...rest,\n    // Assignment V5 always publishes one Classroom post per authored section.\n    // Put these after legacy saved draft fields so reopening an older Hybrid\n    // setup previews the new per-section contract without changing Classroom\n    // until the teacher explicitly saves.\n    publicationStrategy: PUBLICATION_STRATEGIES.SPLIT,\n    includeWarmupInClassroom: true,\n    assignedClassPeriods: Array.isArray(assignedClassPeriods) ? [...assignedClassPeriods] : [],\n""",
              ),
              (
                  """  publicationPlan: suppliedPublicationPlan = null,\n""",
                  """""",
              ),
              (
                  """  const computedPublicationPlan = useMemo(() => planClassroomPublication({\n    assignmentV5: effectiveAssignmentV5,\n    strategy: draft.publicationStrategy || PUBLICATION_STRATEGIES.HYBRID,\n    mainDueDate: draft.dueAt || null,\n    homeworkDueDate: draft.homeworkDueAt || null,\n    includeWarmupInClassroom: draft.includeWarmupInClassroom === true,\n  }), [effectiveAssignmentV5, draft.publicationStrategy, draft.dueAt, draft.homeworkDueAt, draft.includeWarmupInClassroom]);\n\n  const publicationPlan = suppliedPublicationPlan && !initialDraft.publicationStrategy\n    ? suppliedPublicationPlan\n    : computedPublicationPlan;\n""",
                  """  const computedPublicationPlan = useMemo(() => planClassroomPublication({\n    assignmentV5: effectiveAssignmentV5,\n    strategy: PUBLICATION_STRATEGIES.SPLIT,\n    mainDueDate: draft.dueAt || null,\n    homeworkDueDate: draft.homeworkDueAt || null,\n    includeWarmupInClassroom: true,\n  }), [effectiveAssignmentV5, draft.dueAt, draft.homeworkDueAt]);\n\n  const publicationPlan = computedPublicationPlan;\n""",
              ),
              (
                  """      <fieldset style={fieldsetStyle}>\n        <legend style={legendStyle}>Publication plan</legend>\n        <div style={{ display: 'grid', gridTemplateColumns: isNarrow ? '1fr' : 'repeat(auto-fit, minmax(220px, 1fr))', gap: 14 }}>\n          <label style={labelStyle}>Strategy<select value={draft.publicationStrategy} onChange={(event) => setField('publicationStrategy', event.target.value)} style={inputStyle}><option value=\"hybrid\">Hybrid</option><option value=\"bundle\">Bundle</option><option value=\"split\">Split by section</option></select></label>\n          <label style={labelStyle}>Separate homework due date (optional)<input type=\"datetime-local\" value={draft.homeworkDueAt || ''} onChange={(event) => setField('homeworkDueAt', event.target.value)} style={inputStyle} /></label>\n        </div>\n        <label style={{ display: 'flex', alignItems: 'center', gap: 8, minHeight: 44, marginTop: 8, fontWeight: 800 }}><input type=\"checkbox\" style={checkboxStyle} checked={draft.includeWarmupInClassroom === true} onChange={(event) => setField('includeWarmupInClassroom', event.target.checked)} /> Include Warm-Up as a Classroom post</label>\n        <div style={{ marginTop: 8, color: '#5f6368', fontSize: 12, lineHeight: 1.5 }}>{publicationPlan.summary} {publicationPlan.omittedWarmupCount ? `${publicationPlan.omittedWarmupCount} Warm-Up section omitted by default.` : ''}</div>\n      </fieldset>\n""",
                  """      <fieldset style={fieldsetStyle}>\n        <legend style={legendStyle}>Google Classroom posts</legend>\n        <p style={{ margin: '0 0 12px', color: '#3c4043', fontSize: 13, lineHeight: 1.5 }}>\n          Each assignment section gets its own Google Classroom post and grade column. Titles start with the section name, followed by the assignment name, so student gradebooks stay easy to scan.\n        </p>\n        <label style={labelStyle}>Separate Practice due date (optional)<input type=\"datetime-local\" value={draft.homeworkDueAt || ''} onChange={(event) => setField('homeworkDueAt', event.target.value)} style={inputStyle} /></label>\n        <div style={{ marginTop: 8, color: '#5f6368', fontSize: 12, lineHeight: 1.5 }}>{publicationPlan.summary}</div>\n      </fieldset>\n""",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/teacher/LessonPreflightModal.jsx
          git commit -m "fix: default V5 review to per-section Classroom posts"
          git push origin HEAD:fix/per-section-classroom-posts
