name: PR263 attendance hardening

on:
  push:
    branches:
      - 'claude/nifty-shannon-t9a7s3'
    paths:
      - '.github/workflows/pr263-finish.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply PR263 hardening patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement, found {count}')
              p.write_text(text.replace(old, new, 1))

          # 1) Browser lifecycle: a legacy student dueAt may extend a class final
          # cutoff, but can never shorten a later class-wide lateDueAt.
          replace_once('src/assignmentLifecycle.js', '''  if (field === 'late') {
            return parseLocalDateTime(
              override?.lateDueAt || override?.dueAt || assignment.lateDueAt || assignment.lateDueDate || assignment.dueAt || assignment.dueDate,
              true,
            );
          }
          ''', '''  if (field === 'late') {
            const classFinal = parseLocalDateTime(
              assignment.lateDueAt || assignment.lateDueDate || assignment.dueAt || assignment.dueDate,
              true,
            );
            const studentFinal = parseLocalDateTime(override?.lateDueAt || override?.dueAt, true);
            if (!classFinal) return studentFinal;
            if (!studentFinal) return classFinal;
            return studentFinal.getTime() > classFinal.getTime() ? studentFinal : classFinal;
          }
          ''')

          # 2) Server section deadline parity.
          replace_once('functions/shared/sectionDeadline.mjs', '''export const assignmentFinalCloseAt = (assignment, timeZone = null, studentId = null) => {
            const override = studentId ? assignment?.studentOverrides?.[studentId] : null;
            return parseInstant(
              override?.lateDueAt || override?.dueAt
                || assignment?.lateDueAt || assignment?.lateDueDate || assignment?.dueAt || assignment?.dueDate,
              { endOfDay: true, timeZone },
            );
          };
          ''', '''export const assignmentFinalCloseAt = (assignment, timeZone = null, studentId = null) => {
            const override = studentId ? assignment?.studentOverrides?.[studentId] : null;
            const classFinalCloseAt = parseInstant(
              assignment?.lateDueAt || assignment?.lateDueDate || assignment?.dueAt || assignment?.dueDate,
              { endOfDay: true, timeZone },
            );
            const studentFinalCloseAt = parseInstant(
              override?.lateDueAt || override?.dueAt,
              { endOfDay: true, timeZone },
            );
            if (classFinalCloseAt === null) return studentFinalCloseAt;
            if (studentFinalCloseAt === null) return classFinalCloseAt;
            return Math.max(classFinalCloseAt, studentFinalCloseAt);
          };
          ''')

          # 3) Practice Pass server lifecycle parity.
          replace_once('functions/shared/classPointRewards.mjs', '''  const lateDueAt = toInstant(
            override?.lateDueAt || override?.dueAt
              || assignment?.lateDueAt || assignment?.lateDueDate || assignment?.dueAt || assignment?.dueDate,
          );
          ''', '''  const classLateDueAt = toInstant(
            assignment?.lateDueAt || assignment?.lateDueDate || assignment?.dueAt || assignment?.dueDate,
          );
          const studentLateDueAt = toInstant(override?.lateDueAt || override?.dueAt);
          const lateDueAt = classLateDueAt === null
            ? studentLateDueAt
            : studentLateDueAt === null
              ? classLateDueAt
              : Math.max(classLateDueAt, studentLateDueAt);
          ''')

          # 4) Functions/passback helper parity + do not let allowShorten bypass
          # malformed input validation.
          replace_once('functions/index.js', '''function studentLateDueAt(assignment, studentId) {
            const override = studentId ? assignment?.studentOverrides?.[studentId] : null;
            return toDate(
              override?.lateDueAt || override?.dueAt
                || assignment?.lateDueAt || assignment?.lateDueDate || assignment?.dueAt || assignment?.dueDate
            );
          }
          ''', '''function studentLateDueAt(assignment, studentId) {
            const override = studentId ? assignment?.studentOverrides?.[studentId] : null;
            const classFinal = toDate(
              assignment?.lateDueAt || assignment?.lateDueDate || assignment?.dueAt || assignment?.dueDate
            );
            const studentFinal = toDate(override?.lateDueAt || override?.dueAt);
            if (!classFinal) return studentFinal;
            if (!studentFinal) return classFinal;
            return studentFinal.getTime() > classFinal.getTime() ? studentFinal : classFinal;
          }
          ''')
          replace_once('functions/index.js', '''    if (!validity.valid && !allowShorten) throw new HttpsError(validity.reason, validity.message);
          ''', '''    if (!validity.valid && !(allowShorten && validity.reason === "failed-precondition")) {
              throw new HttpsError(validity.reason, validity.message);
            }
          ''')

          # 5) Reconciliation: removing the last absence must produce a shortening
          # review, and unclassified live absences belong in the audit dates.
          replace_once('src/platform/attendance/extensionReconciliation.js', '''  if (!finalCutoff || !classPeriod || extensionMeetings === 0) {
            return {
              changed: false, reviewNeeded: false, reason: 'no_extension_earned',
              absences, extensionMeetings: 0, proposed: null, existing,
            };
          }
          ''', '''  if (!finalCutoff || !classPeriod) {
            return {
              changed: false, reviewNeeded: false, reason: 'no_extension_earned',
              absences, extensionMeetings: 0, proposed: null, existing,
            };
          }

          if (extensionMeetings === 0) {
            const baselineDateKey = localDateKeyOf(finalCutoff);
            const proposed = {
              dueAt: finalCutoff,
              dateKey: baselineDateKey,
              meetingsGranted: 0,
              meetingsRequested: 0,
              undetermined: false,
              resolved: true,
              sourceAbsenceDates: [],
            };
            if (existing?.dateKey && baselineDateKey && baselineDateKey < existing.dateKey) {
              return {
                changed: false, reviewNeeded: true, reason: 'would_shorten_existing_extension',
                absences, extensionMeetings: 0, proposed, existing,
              };
            }
            return {
              changed: false, reviewNeeded: false, reason: 'no_extension_earned',
              absences, extensionMeetings: 0, proposed: null, existing,
            };
          }
          ''')
          replace_once('src/platform/attendance/extensionReconciliation.js', '''    sourceAbsenceDates: [...absences.dates.excused, ...absences.dates.unexcused].sort(),
          ''', '''    sourceAbsenceDates: [
              ...absences.dates.excused,
              ...absences.dates.unexcused,
              ...(absences.dates.unclassified || []),
            ].sort(),
          ''')

          marker = '''/**
           * Every assignment a fresh attendance mark on `correctionDateKey` bears on,
          '''
          range_helper = '''/**
           * The smallest class/date attendance window needed to recompute every
           * assignment touched by one correction. This keeps reconciliation off the
           * teacher-wide 750-event support feed without fetching a whole school year.
           */
          export const attendanceReconciliationRangeForCorrection = ({
            assignments = [], classId = null, correctionDateKey = null,
          } = {}) => {
            const affected = (Array.isArray(assignments) ? assignments : [])
              .filter((assignment) => assignmentIsForStudent(assignment, { classId }))
              .filter((assignment) => {
                const dueDateKey = localDateKeyOf(assignment?.dueAt || assignment?.dueDate);
                const releaseDateKey = localDateKeyOf(assignment?.releaseAt || assignment?.releaseDate) || '0000-00-00';
                return dueDateKey && correctionDateKey >= releaseDateKey && correctionDateKey <= dueDateKey;
              });
            if (!affected.length) return null;
            const fromDateKeys = affected
              .map((assignment) => localDateKeyOf(assignment?.releaseAt || assignment?.releaseDate) || correctionDateKey)
              .filter(Boolean);
            const toDateKeys = affected
              .map((assignment) => localDateKeyOf(assignment?.dueAt || assignment?.dueDate))
              .filter(Boolean);
            if (!fromDateKeys.length || !toDateKeys.length) return null;
            return {
              fromDateKey: [...fromDateKeys].sort()[0],
              toDateKey: [...toDateKeys].sort().at(-1),
            };
          };

          /**
           * Every assignment a fresh attendance mark on `correctionDateKey` bears on,
          '''
          replace_once('src/platform/attendance/extensionReconciliation.js', marker, range_helper)

          # 6) Persist the top-level dateKey the new indexed attendance queries
          # actually filter on, and add a scoped date-range fetch for extension
          # recomputation.
          replace_once('src/platform/teacher/studentSupportStore.js', '''    classPeriod: clean(event.classPeriod) || null,
              originClassId: clean(event.classId) || null,
          ''', '''    classPeriod: clean(event.classPeriod) || null,
              dateKey: clean(event.dateKey || event?.evidence?.dateKey) || null,
              originClassId: clean(event.classId) || null,
          ''')

          store_path = Path('src/platform/teacher/studentSupportStore.js')
          store_text = store_path.read_text()
          insert_before = '''export const subscribeStudentSessionSummaries = ({
          '''
          if insert_before not in store_text:
              raise SystemExit('studentSupportStore.js: range-query insertion point not found')
          range_fetch = '''/**
           * Fetch the bounded instructional window needed to recompute attendance
           * extensions. The existing composite index
           * authorizedTeacherEmails + classId + dateKey serves both the one-day
           * Attendance History query and this range query.
           */
          export const fetchAttendanceForClassRange = async ({
            db, teacherEmail, classId, fromDateKey, toDateKey,
          } = {}) => {
            const email = clean(teacherEmail).toLowerCase();
            const scopedClassId = clean(classId);
            const from = clean(fromDateKey);
            const to = clean(toDateKey);
            if (!db || !email || !scopedClassId || !from || !to || from > to) return [];

            const snapshot = await getDocs(query(
              collection(db, STUDENT_SUPPORT_COLLECTION),
              where('authorizedTeacherEmails', 'array-contains', email),
              where('classId', '==', scopedClassId),
              where('dateKey', '>=', from),
              where('dateKey', '<=', to),
            ));
            return snapshot.docs.map((entry) => ({ id: entry.id, ...entry.data() }));
          };

          '''
          if 'export const fetchAttendanceForClassRange' in store_text:
              raise SystemExit('studentSupportStore.js: range fetch already exists unexpectedly')
          store_path.write_text(store_text.replace(insert_before, range_fetch + insert_before, 1))

          # 7) App wiring: reconciliation uses the scoped attendance range, and if
          # an extension write fails after attendance was already appended, a
          # durable append-only pending marker drives an automatic retry instead
          # of silently leaving the deadline stale.
          replace_once('src/App.jsx', '''import {
            fetchStudentSupportHistory,
            recordStudentSupportEvent,
            subscribeStudentSessionSummaries,
            subscribeStudentSupportEvents,
          } from './platform/teacher/studentSupportStore.js';
          ''', '''import {
            fetchAttendanceForClassRange,
            fetchStudentSupportHistory,
            recordStudentSupportEvent,
            subscribeStudentSessionSummaries,
            subscribeStudentSupportEvents,
          } from './platform/teacher/studentSupportStore.js';
          ''')
          replace_once('src/App.jsx', '''import {
            buildStudentExtensionPatch,
            reconcileAssignmentExtensionsForCorrection,
          } from './platform/attendance/extensionReconciliation.js';
          ''', '''import {
            attendanceReconciliationRangeForCorrection,
            buildStudentExtensionPatch,
            reconcileAssignmentExtensionsForCorrection,
          } from './platform/attendance/extensionReconciliation.js';
          ''')

          old_reconcile = '''  const reconcileAttendanceExtensions = async (event, record) => {
            const classPeriod = classes.find((entry) => entry.classId === event.classId)?.period || null;
            const results = reconcileAssignmentExtensionsForCorrection({
              assignments,
              studentId: event.studentId,
              classId: event.classId,
              classPeriod,
              schedule: classSchedule,
              nonInstructionalKeys: SCHOOL_NON_INSTRUCTIONAL_KEYS,
              supportEvents: [...studentSupportEvents, record],
              correctionDateKey: event.evidence?.dateKey,
            });

            let reviewCount = 0;
            await Promise.all(results.map(async ({ assignment, resolution }) => {
              if (resolution.reviewNeeded) { reviewCount += 1; return; }
              const patch = buildStudentExtensionPatch({
                assignment, studentId: event.studentId, resolution, actorEmail: user.email,
              });
              if (patch) await applyStudentOverridePatch({ assignmentId: assignment.id, studentId: event.studentId, classId: event.classId, patch });
            }));
            return reviewCount;
          };
          '''
          new_reconcile = '''  const reconcileAttendanceExtensions = async (event, record) => {
            const classPeriod = classes.find((entry) => entry.classId === event.classId)?.period || null;
            const correctionDateKey = event?.evidence?.dateKey || event?.dateKey || null;
            const range = attendanceReconciliationRangeForCorrection({
              assignments, classId: event.classId, correctionDateKey,
            });
            const scopedSupportEvents = range
              ? await fetchAttendanceForClassRange({
                db,
                teacherEmail: user.email,
                classId: event.classId,
                fromDateKey: range.fromDateKey,
                toDateKey: range.toDateKey,
              })
              : [];
            const mergedEvents = new Map();
            [...scopedSupportEvents, record].filter(Boolean).forEach((entry, index) => {
              const key = entry.id || `${entry.kind || 'event'}:${entry.studentId || ''}:${entry.createdAt || index}`;
              mergedEvents.set(key, entry);
            });
            const results = reconcileAssignmentExtensionsForCorrection({
              assignments,
              studentId: event.studentId,
              classId: event.classId,
              classPeriod,
              schedule: classSchedule,
              nonInstructionalKeys: SCHOOL_NON_INSTRUCTIONAL_KEYS,
              supportEvents: [...mergedEvents.values()],
              correctionDateKey,
            });

            let reviewCount = 0;
            await Promise.all(results.map(async ({ assignment, resolution }) => {
              if (resolution.reviewNeeded) { reviewCount += 1; return; }
              const patch = buildStudentExtensionPatch({
                assignment, studentId: event.studentId, resolution, actorEmail: user.email,
              });
              if (patch) await applyStudentOverridePatch({ assignmentId: assignment.id, studentId: event.studentId, classId: event.classId, patch });
            }));
            return reviewCount;
          };
          '''
          replace_once('src/App.jsx', old_reconcile, new_reconcile)

          replace_once('src/App.jsx', '''  const ATTENDANCE_EVENT_KINDS = [LIVE_ATTENDANCE_EVENT_KIND, ATTENDANCE_HISTORY_EVENT_KIND];

          const handleRecordStudentSupportEvent = async (event) => {
          ''', '''  const ATTENDANCE_EVENT_KINDS = [LIVE_ATTENDANCE_EVENT_KIND, ATTENDANCE_HISTORY_EVENT_KIND];
          const ATTENDANCE_RECONCILIATION_PENDING_KIND = 'attendanceExtensionReconciliationPending';
          const ATTENDANCE_RECONCILIATION_RESOLVED_KIND = 'attendanceExtensionReconciliationResolved';
          const attendanceReconciliationRetryRef = useRef(new Set());

          const handleRecordStudentSupportEvent = async (event) => {
          ''')

          old_attendance_branch = '''      if (isAttendanceEvent) {
                const reviewCount = await reconcileAttendanceExtensions(event, record);
                toastSuccess(
                  event.kind === ATTENDANCE_HISTORY_EVENT_KIND ? 'Attendance correction saved' : 'Attendance recorded',
                  reviewCount > 0
                    ? `${reviewCount} extension${reviewCount === 1 ? '' : 's'} would have shortened — review before changing.`
                    : 'The prior mark stays in the record; any earned extension was reconciled.',
                );
                return record;
              }
          '''
          new_attendance_branch = '''      if (isAttendanceEvent) {
                try {
                  const reviewCount = await reconcileAttendanceExtensions(event, record);
                  toastSuccess(
                    event.kind === ATTENDANCE_HISTORY_EVENT_KIND ? 'Attendance correction saved' : 'Attendance recorded',
                    reviewCount > 0
                      ? `${reviewCount} extension${reviewCount === 1 ? '' : 's'} would have shortened — review before changing.`
                      : 'The prior mark stays in the record; any earned extension was reconciled.',
                  );
                } catch (reconciliationError) {
                  console.error('Attendance saved but extension reconciliation failed:', reconciliationError);
                  const dateKey = event?.evidence?.dateKey || event?.dateKey || null;
                  try {
                    await recordStudentSupportEvent({
                      db,
                      teacherEmail: user.email,
                      event: {
                        kind: ATTENDANCE_RECONCILIATION_PENDING_KIND,
                        stage: SUPPORT_EVENT_STAGE.TEACHER_CONFIRMED,
                        studentId: event.studentId,
                        studentName: event.studentName,
                        classId: event.classId,
                        classPeriod: event.classPeriod,
                        dateKey,
                        source: 'attendanceReconciliation',
                        relatedEventId: record.id,
                        summary: 'Attendance saved; extension reconciliation is queued for retry.',
                        evidence: {
                          dateKey,
                          sourceAttendanceEventId: record.id,
                          queuedAt: Date.now(),
                        },
                      },
                    });
                    toastError(
                      'Attendance saved; extension update queued',
                      'The attendance mark is safe. MathMaster will retry the deadline reconciliation automatically.',
                    );
                  } catch (queueError) {
                    console.error('Could not persist attendance reconciliation retry state:', queueError);
                    toastError(
                      'Attendance saved; extension needs attention',
                      'The attendance mark is safe, but MathMaster could not queue the deadline retry. Re-record this mark after connectivity returns.',
                    );
                  }
                }
                return record;
              }
          '''
          replace_once('src/App.jsx', old_attendance_branch, new_attendance_branch)

          handler_tail = '''  };

            // Teachers stream presence only while the live grid is on screen. Subscribe
          '''
          retry_effect = '''  };

            // A failed extension write never disappears behind a success-looking attendance
            // record. The pending marker above is append-only and this effect retries it
            // whenever the support stream is available again. Successful retries record a
            // second append-only resolution marker, so retries remain idempotent and auditable.
            useEffect(() => {
              if (user?.role !== 'teacher' || !user.email) return undefined;
              const resolvedSourceIds = new Set(
                (Array.isArray(studentSupportEvents) ? studentSupportEvents : [])
                  .filter((entry) => entry?.kind === ATTENDANCE_RECONCILIATION_RESOLVED_KIND)
                  .map((entry) => entry?.evidence?.sourceAttendanceEventId || entry?.relatedEventId)
                  .filter(Boolean),
              );
              const pending = (Array.isArray(studentSupportEvents) ? studentSupportEvents : [])
                .filter((entry) => entry?.kind === ATTENDANCE_RECONCILIATION_PENDING_KIND)
                .filter((entry) => {
                  const sourceId = entry?.evidence?.sourceAttendanceEventId || entry?.relatedEventId;
                  return sourceId && !resolvedSourceIds.has(sourceId);
                })
                .slice(0, 10);
              if (!pending.length) return undefined;

              let cancelled = false;
              pending.forEach((pendingEntry) => {
                const sourceId = pendingEntry?.evidence?.sourceAttendanceEventId || pendingEntry?.relatedEventId;
                if (!sourceId || attendanceReconciliationRetryRef.current.has(sourceId)) return;
                const sourceRecord = studentSupportEvents.find((entry) => entry?.id === sourceId);
                if (!sourceRecord || !ATTENDANCE_EVENT_KINDS.includes(sourceRecord.kind)) return;
                attendanceReconciliationRetryRef.current.add(sourceId);
                void (async () => {
                  try {
                    await reconcileAttendanceExtensions(sourceRecord, sourceRecord);
                    if (cancelled) return;
                    await recordStudentSupportEvent({
                      db,
                      teacherEmail: user.email,
                      event: {
                        kind: ATTENDANCE_RECONCILIATION_RESOLVED_KIND,
                        stage: SUPPORT_EVENT_STAGE.TEACHER_CONFIRMED,
                        studentId: sourceRecord.studentId,
                        studentName: sourceRecord.studentName,
                        classId: sourceRecord.classId,
                        classPeriod: sourceRecord.classPeriod,
                        dateKey: sourceRecord?.evidence?.dateKey || sourceRecord?.dateKey || null,
                        source: 'attendanceReconciliation',
                        relatedEventId: pendingEntry.id,
                        summary: 'Queued attendance extension reconciliation completed.',
                        evidence: {
                          sourceAttendanceEventId: sourceId,
                          pendingEventId: pendingEntry.id,
                          resolvedAt: Date.now(),
                        },
                      },
                    });
                  } catch (error) {
                    console.warn('Queued attendance extension reconciliation is still pending:', error);
                  } finally {
                    attendanceReconciliationRetryRef.current.delete(sourceId);
                  }
                })();
              });

              return () => { cancelled = true; };
            }, [studentSupportEvents, assignments, classes, classSchedule, user?.role, user?.email]);

            // Teachers stream presence only while the live grid is on screen. Subscribe
          '''
          replace_once('src/App.jsx', handler_tail, retry_effect)

          # 8) Focused regression tests for the defects fixed above and wiring
          # contracts that are otherwise difficult to emulate without Firestore.
          Path('tests/platform/pr263AttendanceHardening.test.mjs').write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          import {
            DEFAULT_CLASS_SCHEDULE,
            getAssignmentLifecycle,
            normalizeSchedule,
          } from '../../src/assignmentLifecycle.js';
          import { assignmentFinalCloseAt } from '../../functions/shared/sectionDeadline.mjs';
          import { assignmentCreditLifecycle } from '../../functions/shared/classPointRewards.mjs';
          import { ATTENDANCE_MARK } from '../../src/platform/attendance/absencePolicy.js';
          import {
            attendanceReconciliationRangeForCorrection,
            resolveStudentExtension,
          } from '../../src/platform/attendance/extensionReconciliation.js';

          const period = (enabled) => ({ enabled, start: '09:00', end: '09:50' });
          const schedule = normalizeSchedule({
            ...DEFAULT_CLASS_SCHEDULE,
            daySchedules: {
              A: { periods: { 'Period 3': period(true) } },
              B: { periods: { 'Period 3': period(false) } },
            },
          });

          test('legacy dueAt override can extend but never shorten a later class final cutoff across browser and server lifecycle readers', () => {
            const classLateDueAt = '2026-09-25T23:59:00.000Z';
            const earlier = {
              id: 'a1', dueAt: '2026-09-18T23:59:00.000Z', lateDueAt: classLateDueAt,
              studentOverrides: { s1: { dueAt: '2026-09-20T23:59:00.000Z' } },
            };
            const browser = getAssignmentLifecycle(earlier, new Date('2026-09-23T12:00:00.000Z'), { studentId: 's1' });
            assert.equal(browser.creditEligible, true);
            assert.equal(browser.status, 'late');
            assert.equal(assignmentFinalCloseAt(earlier, null, 's1'), Date.parse(classLateDueAt));
            assert.equal(assignmentCreditLifecycle(earlier, Date.parse('2026-09-23T12:00:00.000Z'), 's1').creditEligible, true);

            const later = {
              ...earlier,
              studentOverrides: { s1: { dueAt: '2026-10-02T23:59:00.000Z' } },
            };
            assert.equal(assignmentFinalCloseAt(later, null, 's1'), Date.parse('2026-10-02T23:59:00.000Z'));
            assert.equal(assignmentCreditLifecycle(later, Date.parse('2026-09-26T12:00:00.000Z'), 's1').creditEligible, true);
          });

          test('removing the last absence produces an explicit shortening review back to the class final cutoff', () => {
            const assignment = {
              id: 'a1',
              releaseAt: '2026-08-24T00:00:00.000Z',
              dueAt: '2026-08-31T23:59:00.000Z',
              lateDueAt: '2026-09-04T23:59:00.000Z',
              studentOverrides: {
                s1: { extension: { dateKey: '2026-09-09', meetingsGranted: 1 }, lateDueAt: '2026-09-09T23:59:00.000Z' },
              },
            };
            const resolution = resolveStudentExtension({
              assignment, studentId: 's1', marks: [], schedule, classPeriod: 'Period 3', nonInstructionalKeys: new Set(),
            });
            assert.equal(resolution.reviewNeeded, true);
            assert.equal(resolution.reason, 'would_shorten_existing_extension');
            assert.equal(resolution.extensionMeetings, 0);
            assert.equal(resolution.proposed.dateKey, '2026-09-04');
            assert.deepEqual(resolution.proposed.sourceAbsenceDates, []);
          });

          test('an unclassified live absence is represented in extension audit source dates', () => {
            const assignment = {
              id: 'a2', releaseAt: '2026-08-24T00:00:00.000Z', dueAt: '2026-08-31T23:59:00.000Z',
            };
            const resolution = resolveStudentExtension({
              assignment,
              studentId: 's1',
              marks: [{ dateKey: '2026-08-31', mark: ATTENDANCE_MARK.ABSENT_UNCLASSIFIED, classMet: true }],
              schedule,
              classPeriod: 'Period 3',
              nonInstructionalKeys: new Set(),
            });
            assert.equal(resolution.changed, true);
            assert.deepEqual(resolution.proposed.sourceAbsenceDates, ['2026-08-31']);
          });

          test('reconciliation range is limited to assignments touched by the corrected instructional date', () => {
            const range = attendanceReconciliationRangeForCorrection({
              classId: 'c1',
              correctionDateKey: '2026-09-03',
              assignments: [
                { id: 'a1', assignedClassIds: ['c1'], releaseAt: '2026-09-01', dueAt: '2026-09-05' },
                { id: 'a2', assignedClassIds: ['c1'], releaseAt: '2026-09-02', dueAt: '2026-09-08' },
                { id: 'other', assignedClassIds: ['c1'], releaseAt: '2026-09-10', dueAt: '2026-09-15' },
              ],
            });
            assert.deepEqual(range, { fromDateKey: '2026-09-01', toDateKey: '2026-09-08' });
          });

          test('attendance storage and App wiring preserve dateKey, use scoped range history, and persist retry state', () => {
            const store = readFileSync(new URL('../../src/platform/teacher/studentSupportStore.js', import.meta.url), 'utf8');
            const app = readFileSync(new URL('../../src/App.jsx', import.meta.url), 'utf8');
            assert.match(store, /dateKey: clean\(event\.dateKey \|\| event\?\.evidence\?\.dateKey\) \|\| null/);
            assert.match(store, /export const fetchAttendanceForClassRange/);
            assert.match(store, /where\('dateKey', '>=', from\)/);
