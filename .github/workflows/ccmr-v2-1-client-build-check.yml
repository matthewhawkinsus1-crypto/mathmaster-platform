name: CCMR V2.1 Client Build Verification

on:
  push:
    branches:
      - ccmr-fidelity-v2-1-authentic-language
    paths:
      - 'src/components/student/MyMathPathProductionContainer.jsx'
      - 'src/platform/path/sessionContentReleaseRollover.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ccmr-v2-1-client-build-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Build production client
        run: npm run build
