name: CCMR V2.1 Digital SAT Content Repair

on:
  push:
    branches:
      - ccmr-fidelity-v2-1-authentic-language
    paths:
      - 'scripts/patch-digital-sat-v2-1-content-repair.mjs'
      - 'scripts/fix-digital-sat-v2-1-content-repair-special-cases.mjs'
      - '.github/workflows/ccmr-v2-1-digital-sat-content-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-guarded-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ccmr-fidelity-v2-1-authentic-language
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Normalize temporary repair-script object keys
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('scripts/patch-digital-sat-v2-1-content-repair.mjs')
          text = path.read_text()
          text = re.sub(r'^  (mm_sat_[A-Za-z0-9_-]+):', r"  '\1':", text, flags=re.MULTILINE)
          path.write_text(text)
          PY
      - name: Syntax check repair scripts
        run: |
          node --check scripts/patch-digital-sat-v2-1-content-repair.mjs
          node --check scripts/fix-digital-sat-v2-1-content-repair-special-cases.mjs
      - name: Verify guarded repair selection
        run: node scripts/patch-digital-sat-v2-1-content-repair.mjs --check
      - name: Apply guarded response-ecology and clone repairs
        run: |
          node scripts/patch-digital-sat-v2-1-content-repair.mjs
          node scripts/fix-digital-sat-v2-1-content-repair-special-cases.mjs
      - name: Restore temporary repair script before diff audit
        run: git restore scripts/patch-digital-sat-v2-1-content-repair.mjs
      - name: Run Digital SAT authoring gate regressions
        run: node --test tests/platform/digitalSatV21AuthoringGate.test.mjs
      - name: Run Digital SAT production response-ecology contract
        run: node --test tests/platform/digitalSatProductionSeedContent.test.mjs
      - name: Validate complete Digital SAT V2.1 release
        run: node scripts/build-digital-sat-v2-1.mjs --release --check
      - name: Guard changed paths
        run: |
          python - <<'PY'
          import subprocess
          changed = [line.strip() for line in subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines() if line.strip()]
          if not changed:
              raise SystemExit('Repair produced no content changes')
          bad = [p for p in changed if not p.startswith('drafts/ccmr-v2.1/digitalSAT/')]
          if bad:
              raise SystemExit(f'Unexpected changed paths: {bad}')
          print(f'Guarded content changes: {len(changed)} files')
          PY
      - name: Commit guarded Digital SAT content repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drafts/ccmr-v2.1/digitalSAT
          git commit -m 'Repair Digital SAT V2.1 response ecology and clones'
          git push origin HEAD:ccmr-fidelity-v2-1-authentic-language
