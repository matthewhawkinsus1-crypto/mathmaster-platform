name: Universal Work View Stage 4 Certification
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        device:
          - chromebook
          - laptop
          - tablet-portrait
          - tablet-landscape
          - iphone-portrait
          - iphone-landscape
          - android-narrow
          - android-landscape
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start production-style harness
        run: |
          npx vite --host 127.0.0.1 --port 5199 --strictPort >/tmp/stage4-vite.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:5199/tests/browser/workViewCertification.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/stage4-vite.log; exit 1
      - name: Run Stage 4 certification
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
          WORK_VIEW_CERTIFICATION_DEVICE: ${{ matrix.device }}
        run: node tests/browser/workViewCertification.mjs
      - name: Run terminal-state lifecycle regression
        if: matrix.device == 'chromebook'
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/workViewTerminalTransition.mjs
      - name: Upload device/family/state screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-work-view-stage-4-${{ matrix.device }}
          path: tests/browser/artifacts/workViewStage4/${{ matrix.device }}
          if-no-files-found: error
          retention-days: 14
