name: Systems Substitution Browser Certification

on:
  pull_request:
    paths:
      - "src/tools/systemsWorkspace/**"
      - "src/StepByStepAlgebraCore.jsx"
      - "src/StepByStepAlgebra.css"
      - "src/AlgebraTermRow.jsx"
      - "src/algebraAstEngine.js"
      - "src/algebraDistributionModel.js"
      - "src/algebraLikeTermsModel.js"
      - "src/tools/stepAlgebra2/StepAlgebra2.jsx"
      - "src/tools/shared/usePersistentToolState.js"
      - "src/platform/workView/useMathUndoHistory.js"
      - "tests/browser/algebraicSubstitutionHandoff*"
      - "tests/browser/algebraicSystems3x3*"
      - "tests/browser/stepAlgebraDriver.mjs"
      - "tests/platform/fixtures/classworkQ2RuntimeCapture.json"
      - ".github/workflows/systems-substitution-browser.yml"
  workflow_dispatch:

jobs:
  substitution-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start browser harness
        run: |
          npx vite --host 127.0.0.1 --port 5199 --strictPort > /tmp/mathmaster-vite.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5199/tests/browser/algebraicSubstitutionHandoff.html >/dev/null \
              && curl --fail --silent http://127.0.0.1:5199/tests/browser/algebraicSystems3x3.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mathmaster-vite.log
          exit 1

      - name: Drive substitution and inline-distribution workflow
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: http://127.0.0.1:5199
        run: node tests/browser/algebraicSubstitutionHandoff.mjs

      # Issue #341: the full 3×3 solve in Student View and Teacher Preview, the
      # reduced 2×2 through the real 2×2 workflow, Reset Question, and the
      # global rule that a staged balanced move never appears inside the
      # equation before both sides are placed.
      - name: Drive 3×3 substitution and the no-staged-preview rule
        if: always()
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: http://127.0.0.1:5199
        run: node tests/browser/algebraicSystems3x3.mjs

      - name: Publish browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systems-substitution-browser-screenshots
          path: |
            tests/browser/artifacts/algebraicSubstitutionHandoff
            tests/browser/artifacts/algebraicSystems3x3
          if-no-files-found: error
          retention-days: 14
