name: CCMR V2.1 PSDA Audit

on:
  push:
    branches:
      - ccmr-fidelity-v2-1-authentic-language
    paths:
      - 'drafts/ccmr-v2.1/digitalSAT/problemSolvingData/**'
      - 'scripts/build-digital-sat-v2-1.mjs'
      - '.github/workflows/ccmr-v2-1-psda-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  psda-v2-1-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out V2.1 branch
        uses: actions/checkout@v4
        with:
          ref: ccmr-fidelity-v2-1-authentic-language
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: One-time repair of legacy Algebra JSON escapes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const files = [
            'drafts/ccmr-v2.1/digitalSAT/algebra/A.12A.v2.1.json',
            'drafts/ccmr-v2.1/digitalSAT/algebra/A.3D.v2.1.json',
            'drafts/ccmr-v2.1/digitalSAT/algebra/A.3H.v2.1.json',
          ];

          for (const file of files) {
            const source = readFileSync(file, 'utf8');
            const repaired = source.replace(/(?<!\\)\\(?=[A-Za-z])/g, () => '\\\\');
            JSON.parse(repaired);
            if (repaired !== source) writeFileSync(file, repaired);
            console.log(`${file}: valid JSON after scoped LaTeX escape repair`);
          }
          NODE

      - name: Run PSDA fail-closed audit and capture result
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p drafts/ccmr-v2.1/audit-results
          node scripts/build-digital-sat-v2-1.mjs --domain problemSolvingData --check > /tmp/psda-audit.log 2>&1
          audit_exit=$?
          set -e
          cat /tmp/psda-audit.log
          cp /tmp/psda-audit.log drafts/ccmr-v2.1/audit-results/psda-latest.log
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "exit_code=${audit_exit}"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > drafts/ccmr-v2.1/audit-results/psda-latest-status.txt
          echo "exit_code=${audit_exit}" >> "$GITHUB_OUTPUT"

      - name: Commit repaired sources and audit diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            drafts/ccmr-v2.1/digitalSAT/algebra/A.12A.v2.1.json \
            drafts/ccmr-v2.1/digitalSAT/algebra/A.3D.v2.1.json \
            drafts/ccmr-v2.1/digitalSAT/algebra/A.3H.v2.1.json \
            drafts/ccmr-v2.1/audit-results/psda-latest.log \
            drafts/ccmr-v2.1/audit-results/psda-latest-status.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Repair Digital SAT V2.1 JSON escapes and record PSDA audit"
          git pull --rebase origin ccmr-fidelity-v2-1-authentic-language
          git push origin HEAD:ccmr-fidelity-v2-1-authentic-language

      - name: Fail when PSDA audit fails
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
