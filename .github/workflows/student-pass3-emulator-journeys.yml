name: Student Pass 3 Emulator Journeys

# Student pass 3's long browser drivers, which play the real student and
# teacher screens against the real callables (functions/platformEntry.js) on
# the Firestore emulator. Each starts the emulator, a bridge and Vite itself.
#
#   pass3-test-cycle-rich-tools   testCycleRichToolQa: every certified Rich
#                                 Tool on a secure Test, Chromebook, iPad and
#                                 phone, light and dark; a student's session
#                                 autosaved, reloaded and submitted
#   pass3-test-cycle-lifecycle    testCycleLifecycleQa (CI16): a whole Test
#                                 Cycle as a teacher and as students: the
#                                 Review gate, skip and flag, release,
#                                 corrections, the retest, the capped grade;
#                                 Chromebook, iPad and phone, light and dark
#   pass3-live-challenge-shell    liveChallengeShellQa: the Live Challenge
#                                 shell played whole (console, projector,
#                                 students), a class of 40 launching, five
#                                 games in a row
#   pass3-graph-feature-rush      graphFeatureRushGame (CI06): whole Graph
#                                 Feature Rush games: a two-player Grand Prix
#                                 by mouse, touch and keyboard, four devices
#                                 on correct-count, a class of twelve, the
#                                 teacher's practice round, tap latency
#
# Their own workflow and area (scripts/lib/ciAreas.mjs, which ci.yml reads), so
# that only a change that can reach them runs them on a pull request (about 25
# runner-minutes together, in four jobs); every push to main, every night, and
# on demand, they run whatever changed. Read-only: this workflow writes nothing back and
# uses no secrets.

on:
  workflow_call:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The secure Rich Tool runtime on Chromebook, iPad and phone, light and dark,
  # against the real callables on the Firestore emulator. Long: its own job.
  # About 5 minutes locally.
  pass3-test-cycle-rich-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      # The bridge runs the real handlers, and firebase-admin lives in functions/.
      - run: npm --prefix functions ci
      - name: Every certified Rich Tool on a secure Test, on every device
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/testCycleRichToolQa.mjs

  # A whole Test Cycle, as a teacher and as students, against the real
  # callables on the Firestore emulator (CI16; it ran by hand until now): the
  # Review gate on screen and against a direct call, a card that follows the
  # server without a reload, skip / flag / go back with every answer a saved
  # draft, release from the results panel, corrections with real tries, the
  # retest and the capped recorded grade, the teacher preview, and no sideways
  # scroll or unreadable button at Chromebook, iPad and phone widths, light
  # and dark. About 3 minutes locally (71 checks).
  pass3-test-cycle-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - run: npm --prefix functions ci
      - name: A whole Test Cycle, as a teacher and as students
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/testCycleLifecycleQa.mjs

  # The Live Challenge shell (host console, projector, student screens) played
  # whole against the real callables on the Firestore emulator: a classic
  # game, scoring, Graph Feature Rush, reconnects, a class of 40 launching, a
  # big class, Play Again and five games in a row. Long: its own job.
  pass3-live-challenge-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - run: npm --prefix functions ci
      - name: Live Challenge played whole, on every screen
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/liveChallengeShellQa.mjs

  # Whole Graph Feature Rush games in real browsers against the real callables
  # on the Firestore emulator (CI06; it ran by hand until now): a two-player
  # Grand Prix on a Chromebook and a phone by mouse, touch and keyboard (a
  # miss, the cooldown, a refresh, the network dropping), four devices on
  # correct-count, a class of twelve tapping at once, the teacher's practice
  # round, and the tap-to-mark latency with the CPU slowed 4x. About 7 minutes
  # locally.
  pass3-graph-feature-rush:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - run: npm --prefix functions ci
      - name: Graph Feature Rush played whole
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/graphFeatureRushGame.mjs
