name: Apply V5 explicit workflow repair

on:
  push:
    branches:
      - codex/v5-explicit-workflow-repair

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/v5-explicit-workflow-repair

      - name: Apply narrow repair patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from base64 import b64decode

          PRE = b64decode('').decode()
          GRAPH = b64decode('').decode()
          REP = b64decode('').decode()
          UI = b64decode('').decode()

          def replace_between(path, start_marker, end_marker, replacement, start_after=None):
              p = Path(path)
              text = p.read_text()
              search_from = text.index(start_after) if start_after else 0
              start = text.index(start_marker, search_from)
              end = text.index(end_marker, start)
              p.write_text(text[:start] + replacement + text[end:])

          compiler = 'src/platform/contract/authoringIntentV5.js'
          replace_between(compiler, '  if (q.type || q.toolId) {', '  switch (type) {', PRE)
          replace_between(compiler, "    case 'graphChoicePreview': {", "    case 'figureMatch': {", GRAPH)

          repair = 'src/platform/preflight/questionRepairImport.js'
          replace_between(repair,
              '  const pendingTeacherFlagIds = [...new Set(questionResults.flatMap((result) => result.pendingTeacherFlagIds))];',
              '  return {', REP)
          p = Path(repair)
          text = p.read_text()
          text = text.replace("    kind: 'batchQuestionRepairImport',\n    baseRevision: base,", "    kind: 'batchQuestionRepairImport',\n    responseKind,\n    baseRevision: base,", 1)
          text = text.replace("    platformIssues: cloneJson(list(parsedResponse?.platformIssues)),\n    unclearIssues: cloneJson(list(parsedResponse?.unclearIssues)),", "    platformIssues,\n    unclearIssues,", 1)
          p.write_text(text)

          center = 'src/components/teacher/IncompleteAssignmentRepairCenter.jsx'
          replace_between(center,
              '      setStagedImport(staged);',
              '    } catch (error) {', UI,
              start_after='  const stageBatch = () => {')
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/contract/authoringIntentV5.js src/platform/preflight/questionRepairImport.js src/components/teacher/IncompleteAssignmentRepairCenter.jsx
          git commit -m "fix: preserve explicit V5 graph workflows"
          git push origin HEAD:codex/v5-explicit-workflow-repair
