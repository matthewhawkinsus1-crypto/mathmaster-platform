name: Apply V5 explicit workflow repair

on:
  push:
    branches:
      - codex/v5-explicit-workflow-repair

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/v5-explicit-workflow-repair

      - name: Apply narrow repair patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one patch target, found {count}')
              file.write_text(text.replace(old, new, 1))

          compiler = 'src/platform/contract/authoringIntentV5.js'
          replace_once(
              compiler,
              """  if (q.type || q.toolId) {
            repairs.push(`ignored internal type hint on V5 question ${index + 1}; compiled from studentActions instead`);
          }
          const type = resolveIntentType(q, actions);
          if (!type) throw new Error(`V5 question ${index + 1} does not contain enough mathematical intent to choose a student tool. Add studentActions and the needed mathematical data.`);
          let out;
          """,
              """  // Most V5 authoring must still be compiled from mathematical intent rather
          // than renderer ids. graphChoicePreview is the narrow exception because its
          // canonical contract can contain multiple explicitly authored, graded stages
          // that cannot be reconstructed from one top-level choices array.
          const authoredWorkflow = asArray(q.workflow).filter(isObject);
          const explicitWorkflowType = authoredWorkflow.length > 0 && clean(q.type) === 'graphChoicePreview'
            ? 'graphChoicePreview'
            : '';
          if ((q.type || q.toolId) && !explicitWorkflowType) {
            repairs.push(`ignored internal type hint on V5 question ${index + 1}; compiled from studentActions instead`);
          }
          const type = explicitWorkflowType || resolveIntentType(q, actions);
          if (!type) throw new Error(`V5 question ${index + 1} does not contain enough mathematical intent to choose a student tool. Add studentActions and the needed mathematical data.`);
          let out;
          """,
          )

          replace_once(
              compiler,
              """    case 'graphChoicePreview': {
                const window = graphFromIntent(q) || {};
          """,
              """    case 'graphChoicePreview': {
                if (explicitWorkflowType) {
                  const seenStageIds = new Set();
                  authoredWorkflow.forEach((stage, stageIndex) => {
                    const stageId = clean(stage.id);
                    const stageKind = clean(stage.kind);
                    if (!stageId || !stageKind) {
                      throw new Error(`V5 question ${index + 1} explicit workflow stage ${stageIndex + 1} requires both id and kind.`);
                    }
                    if (seenStageIds.has(stageId)) {
                      throw new Error(`V5 question ${index + 1} explicit workflow has duplicate stage id "${stageId}".`);
                    }
                    seenStageIds.add(stageId);
                    if (stageKind === 'multipleChoice') {
                      const choices = asArray(stage.choices).filter(isObject);
                      if (choices.length < 2) {
                        throw new Error(`V5 question ${index + 1} multiple-choice stage "${stageId}" requires at least two choices.`);
                      }
                      const choiceIds = choices.map((choice) => clean(choice.id)).filter(Boolean);
                      if (choiceIds.length !== choices.length || new Set(choiceIds).size !== choiceIds.length) {
                        throw new Error(`V5 question ${index + 1} multiple-choice stage "${stageId}" requires unique non-empty choice ids.`);
                      }
                      const answerId = clean(q.grading?.[stageId]);
                      if (!answerId || !choiceIds.includes(answerId)) {
                        throw new Error(`V5 question ${index + 1} multiple-choice stage "${stageId}" must have a grading key that matches one supplied choice id.`);
                      }
                    }
                  });
                  out = copyCommon(q, {
                    type,
                    workflow: authoredWorkflow.map((stage) => ({ ...stage })),
                    grading: isObject(q.grading) ? { ...q.grading } : q.grading,
                  });
                  repairs.push(`preserved explicit V5 question ${index + 1} graph-choice workflow`);
                  break;
                }
                const window = graphFromIntent(q) || {};
          """,
          )

          repair_import = 'src/platform/preflight/questionRepairImport.js'
          replace_once(
              repair_import,
              """  const pendingTeacherFlagIds = [...new Set(questionResults.flatMap((result) => result.pendingTeacherFlagIds))];
            const allQuestionsSafe = questionResults.every((result) => result.canCommit);

            return {
          """,
              """  const pendingTeacherFlagIds = [...new Set(questionResults.flatMap((result) => result.pendingTeacherFlagIds))];
            const allQuestionsSafe = questionResults.every((result) => result.canCommit);
            const platformIssues = cloneJson(list(parsedResponse?.platformIssues));
            const unclearIssues = cloneJson(list(parsedResponse?.unclearIssues));
            const responseKind = replacements.length === 0 && (platformIssues.length > 0 || unclearIssues.length > 0)
              ? 'reportOnly'
              : replacements.length === 0
                ? 'empty'
                : 'replacementBatch';

            return {
          """,
          )
          replace_once(
              repair_import,
              """    kind: 'batchQuestionRepairImport',
                baseRevision: base,
          """,
              """    kind: 'batchQuestionRepairImport',
                responseKind,
                baseRevision: base,
          """,
          )
          replace_once(
              repair_import,
              """    pendingTeacherFlagIds,
                platformIssues: cloneJson(list(parsedResponse?.platformIssues)),
                unclearIssues: cloneJson(list(parsedResponse?.unclearIssues)),
          """,
              """    pendingTeacherFlagIds,
                platformIssues,
                unclearIssues,
          """,
          )

          repair_center = 'src/components/teacher/IncompleteAssignmentRepairCenter.jsx'
          replace_once(
              repair_center,
              """      setStagedImport(staged);
                setMessage(staged.canCommit
                  ? `Batch repair staged for ${staged.questionResults.length} question${staged.questionResults.length === 1 ? '' : 's'}. Review the diff before applying the atomic batch.`
                  : 'Batch repair is not safe to apply. At least one replacement introduced a new blocker, so MathMaster will apply none of them.');
          """,
              """      setStagedImport(staged);
                if (staged.responseKind === 'reportOnly') {
                  const platformCount = list(staged.platformIssues).length;
                  const unclearCount = list(staged.unclearIssues).length;
                  const reported = [
                    platformCount ? `${platformCount} platform issue${platformCount === 1 ? '' : 's'}` : '',
                    unclearCount ? `${unclearCount} issue${unclearCount === 1 ? '' : 's'} needing clarification` : '',
                  ].filter(Boolean).join(' and ');
                  setMessage(`No question replacements were supplied. The AI reported ${reported || 'issues for review'}. Review the reported issues below; MathMaster did not change the assignment.`);
                } else {
                  setMessage(staged.canCommit
                    ? `Batch repair staged for ${staged.questionResults.length} question${staged.questionResults.length === 1 ? '' : 's'}. Review the diff before applying the atomic batch.`
                    : 'Batch repair is not safe to apply. At least one replacement introduced a new blocker, so MathMaster will apply none of them.');
                }
          """,
          )
          PY

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Repair already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/contract/authoringIntentV5.js src/platform/preflight/questionRepairImport.js src/components/teacher/IncompleteAssignmentRepairCenter.jsx
          git commit -m "fix: preserve explicit V5 graph workflows"
          git push origin HEAD:codex/v5-explicit-workflow-repair
