name: Correct Answer Acceptance Audit

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  answer-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Two commits: on a pull request, the merge commit and its base, which
      # the familyVersion check below compares with.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - run: npm --prefix functions ci
      # The acceptance tests and `npm run audit:answer-acceptance` are not run
      # here: full-platform-suite.yml runs both on every pull request and every
      # push to main, on the same checkout (the platform tests in its shards,
      # the audit in "Tool tests, audits, builds and lint"). They ran twice
      # whenever this area changed (docs/audits/2026-11-28-ci-throughput.md).
      # A field re-asked as another kind of answer moves its familyVersion
      # (the owner, 2026-10-20; W7-1 decision 5).
      - name: A field that asks for another kind of answer moves familyVersion
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node scripts/check-family-version-bumps.mjs --base "$BASE_SHA"
