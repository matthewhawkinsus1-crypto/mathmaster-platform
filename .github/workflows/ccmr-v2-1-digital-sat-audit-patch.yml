name: CCMR V2.1 Digital SAT Audit Patch

on:
  push:
    branches:
      - ccmr-fidelity-v2-1-authentic-language
    paths:
      - 'scripts/patch-digital-sat-v2-1-audit.mjs'
      - '.github/workflows/ccmr-v2-1-digital-sat-audit-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch Digital SAT authoring audit
        run: node scripts/patch-digital-sat-v2-1-audit.mjs
      - name: Commit audit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-digital-sat-v2-1.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Correct Digital SAT V2.1 generator audit semantics"
          git push origin HEAD:ccmr-fidelity-v2-1-authentic-language
