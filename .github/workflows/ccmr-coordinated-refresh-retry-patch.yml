name: Temporary CCMR Coordinated Refresh Retry Patch

on:
  push:
    branches:
      - ccmr-fidelity-v2-1-authentic-language
    paths:
      - 'scripts/patch-ccmr-coordinated-refresh-retry.mjs'
      - '.github/workflows/ccmr-coordinated-refresh-retry-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccmr-fidelity-v2-1-authentic-language
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded runtime patch
        run: node scripts/patch-ccmr-coordinated-refresh-retry.mjs
      - name: Verify syntax and retry contract
        run: |
          node --check functions/index.js
          node --test tests/platform/ccmrSessionRuntimeWiring.test.mjs
      - name: Commit runtime patch
        run: |
          if git diff --quiet -- functions/index.js; then
            echo 'No runtime change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/index.js
          git commit -m 'Protect coordinated CCMR refresh retries'
          git push origin HEAD:ccmr-fidelity-v2-1-authentic-language
