name: Temporary App Section Wiring

on:
  push:
    branches:
      - feat/classroom-section-passback
    paths:
      - scripts/apply-classroom-section-app-wiring.mjs

permissions:
  contents: write

jobs:
  apply-app-wiring:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/classroom-section-passback
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply checked App wiring patch
        run: node scripts/apply-classroom-section-app-wiring.mjs
      - name: Run focused App wiring regression test
        run: node --test tests/platform/classroomSectionAppWiring.test.mjs
      - name: Commit only the App change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire section grades and Classroom launch in app [app-wiring-applied]"
          git push origin HEAD:feat/classroom-section-passback
