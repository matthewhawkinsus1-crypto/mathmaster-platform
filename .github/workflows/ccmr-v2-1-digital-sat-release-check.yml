name: CCMR V2.1 Digital SAT Release Check

on:
  push:
    branches:
      - ccmr-fidelity-v2-1-authentic-language
    paths:
      - 'drafts/ccmr-v2.1/digitalSAT/**'
      - 'scripts/build-digital-sat-v2-1.mjs'
      - 'scripts/lib/digital-sat-production-seed.mjs'
      - 'tests/platform/digitalSatProductionSeedContent.test.mjs'
      - 'tests/platform/digitalSatV21AuthoringGate.test.mjs'
      - '.github/workflows/ccmr-v2-1-digital-sat-release-check.yml'
  workflow_dispatch:

jobs:
  digital-sat-release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check V2.1 publisher
        run: node --check scripts/build-digital-sat-v2-1.mjs

      - name: Run Digital SAT authoring gate regression tests
        run: node --test tests/platform/digitalSatV21AuthoringGate.test.mjs

      - name: Run Digital SAT production compiler contract
        run: node --test tests/platform/digitalSatProductionSeedContent.test.mjs

      - name: Validate complete Digital SAT V2.1 release
        run: node scripts/build-digital-sat-v2-1.mjs --release --check
