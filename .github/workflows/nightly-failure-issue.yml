name: Nightly Failure Issue

# WHO WATCHES THE NIGHTLY (student pass 3, wave 7 decision 23; the owner,
# 2026-10-20). GitHub mails a scheduled run's failure only to whoever last
# edited its cron line, so a red nightly could go unseen for days. When a
# scheduled run of a workflow below fails, this opens an issue labelled
# `nightly-failure` that names the run and its failed jobs, or comments on the
# one already open for that workflow. When a later scheduled run passes, it
# says so on that issue and closes it.
#
# Every workflow with a `schedule:` trigger is listed here, by its `name:`
# (tests/platform/nightlyFailureIssueWorkflow.test.mjs keeps the two in step).
# It runs from main with the token's issue rights only: it reads the run's
# metadata, never its code or artifacts.

on:
  workflow_run:
    workflows:
      - "Student and Teacher Journeys"
      - "Student Pass 3 Emulator Journeys"
      - "Interactive Capability Certification"
    types: [completed]

permissions:
  actions: read
  issues: write

concurrency:
  group: nightly-failure-issue-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: false

jobs:
  report:
    if: github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open, update or close the workflow's nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: |
          set -euo pipefail
          title="Nightly failed: ${WORKFLOW}"
          label="nightly-failure"
          # The open issue for this workflow: its title, matched exactly.
          open_issue() {
            gh issue list --repo "$REPO" --state open --label "$label" --limit 100 --json number,title \
              --jq '.[] | "\(.number)\t\(.title)"' \
              | awk -F '\t' -v want="$title" '$2 == want && !found { print $1; found = 1 }'
          }
          case "$CONCLUSION" in
            failure|timed_out|startup_failure)
              failed_jobs="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" \
                --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "- \(.name)"' || true)"
              body="$(printf '%s\n' \
                "The scheduled run of **${WORKFLOW}** ended \`${CONCLUSION}\`." \
                "" \
                "- Run: ${RUN_URL}" \
                "- Commit: ${HEAD_SHA}" \
                "- Started: ${STARTED}" \
                "" \
                "Failed jobs:" \
                "${failed_jobs:-- (none listed; open the run)}")"
              number="$(open_issue)"
              if [ -n "$number" ]; then
                gh issue comment "$number" --repo "$REPO" --body "$body"
                echo "Commented on #${number}."
              else
                gh label create "$label" --repo "$REPO" --color B60205 \
                  --description "A scheduled CI run failed (nightly-failure-issue.yml)" 2>/dev/null || true
                gh issue create --repo "$REPO" --title "$title" --label "$label" --body "$body"
              fi
              ;;
            success)
              number="$(open_issue)"
              if [ -n "$number" ]; then
                gh issue close "$number" --repo "$REPO" \
                  --comment "The scheduled run passed again: ${RUN_URL} (commit ${HEAD_SHA})."
                echo "Closed #${number}."
              else
                echo "Passed; no open issue for ${WORKFLOW}."
              fi
              ;;
            *)
              echo "Scheduled run ended '${CONCLUSION}' (cancelled or skipped): nothing to report."
              ;;
          esac
