name: Algebra I II Challenge DOK Difficulty Audit

on:
  push:
    paths:
      - "drafts/fidelity-v2/algebra1/**"
      - "drafts/fidelity-v2/algebra2/**"
      - "scripts/audit-challenge-dok-difficulty-v2.mjs"
      - "scripts/audit-challenge-quality-v2.mjs"
      - "tests/platform/challengeDokDifficultyV2Audit.test.mjs"
      - "tests/platform/challengeQualityV2Audit.test.mjs"
      - "ALGEBRA1_2_CHALLENGE_DOK_DIFFICULTY_FOLLOWUP.md"
      - ".github/workflows/challenge-dok-difficulty-v2-audit.yml"
  pull_request:
    paths:
      - "drafts/fidelity-v2/algebra1/**"
      - "drafts/fidelity-v2/algebra2/**"
      - "scripts/audit-challenge-dok-difficulty-v2.mjs"
      - "scripts/audit-challenge-quality-v2.mjs"
      - "tests/platform/challengeDokDifficultyV2Audit.test.mjs"
      - "tests/platform/challengeQualityV2Audit.test.mjs"
      - "ALGEBRA1_2_CHALLENGE_DOK_DIFFICULTY_FOLLOWUP.md"
      - ".github/workflows/challenge-dok-difficulty-v2-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run adaptive coverage and Challenge-quality regression tests
        run: node --test tests/platform/challengeDokDifficultyV2Audit.test.mjs tests/platform/challengeQualityV2Audit.test.mjs
      - name: Enforce complete variant-aware DOK/difficulty coverage
        run: node scripts/audit-challenge-dok-difficulty-v2.mjs --strict
      - name: Enforce authentic Challenge quality
        run: node scripts/audit-challenge-quality-v2.mjs --strict
