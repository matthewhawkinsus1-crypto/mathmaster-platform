name: CCMR V2.1 Digital SAT Diagnostic

on:
  push:
    branches:
      - ccmr-fidelity-v2-1-authentic-language
    paths:
      - 'scripts/diagnose-digital-sat-v2-1-release.mjs'
      - '.github/workflows/ccmr-v2-1-digital-sat-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diagnose Digital SAT V2.1 release
        run: node scripts/diagnose-digital-sat-v2-1-release.mjs
