name: CCMR V2.1 Digital SAT Diagnostic

on:
  push:
    branches:
      - ccmr-fidelity-v2-1-authentic-language
    paths:
      - 'drafts/ccmr-v2.1/digitalSAT/**'
      - 'scripts/diagnose-digital-sat-v2-1-release.mjs'
      - 'scripts/diagnose-digital-sat-v2-1-compact.mjs'
      - '.github/workflows/ccmr-v2-1-digital-sat-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-clones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Capture residual Digital SAT clone pairs
        run: |
          mkdir -p tmp/digital-sat-diagnostics
          node scripts/diagnose-digital-sat-v2-1-compact.mjs --clones > tmp/digital-sat-diagnostics/clones.json
      - name: Upload clone report
        uses: actions/upload-artifact@v4
        with:
          name: digital-sat-clone-diagnostic
          path: tmp/digital-sat-diagnostics/clones.json

  diagnose-response-mix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Capture Digital SAT response-format inventory
        run: |
          mkdir -p tmp/digital-sat-diagnostics
          node scripts/diagnose-digital-sat-v2-1-compact.mjs --spr-summary > tmp/digital-sat-diagnostics/spr-summary.json
      - name: Upload response-format report
        uses: actions/upload-artifact@v4
        with:
          name: digital-sat-response-diagnostic
          path: tmp/digital-sat-diagnostics/spr-summary.json
