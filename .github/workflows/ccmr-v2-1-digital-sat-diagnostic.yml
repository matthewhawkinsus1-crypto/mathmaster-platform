name: CCMR V2.1 Digital SAT Diagnostic

on:
  push:
    branches:
      - ccmr-fidelity-v2-1-authentic-language
    paths:
      - 'drafts/ccmr-v2.1/digitalSAT/**'
      - 'scripts/diagnose-digital-sat-v2-1-release.mjs'
      - 'scripts/diagnose-digital-sat-v2-1-compact.mjs'
      - '.github/workflows/ccmr-v2-1-digital-sat-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-clones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Report residual Digital SAT clone pairs
        run: node scripts/diagnose-digital-sat-v2-1-compact.mjs --clones

  diagnose-response-mix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Report Digital SAT response-format inventory
        run: node scripts/diagnose-digital-sat-v2-1-compact.mjs --spr-summary
