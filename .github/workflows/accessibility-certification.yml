name: Accessibility Certification (WCAG 2.1 AA)

# axe-core over the student screens (Home, Assignments, Grades, an assignment
# with rich tools open, My Math Path, a secure exam, Live Challenge) and the
# teacher's (every destination of the navigation, a class's page, a student's
# drawer and detail page, the Find palette, the Assignment Hub, the Pre-Flight
# review, Create and Assign, Grade Export's and Secure Exams' flows, a Live
# Challenge game with its projector and the administrator's workspace, which are
# also walked by Tab: TT27) at Chromebook and phone sizes, ratcheted against
# scripts/accessibility-baseline.json: a new or increased violation fails; a
# reduction passes. Read-only: nothing is written back to the repository and
# nothing reaches Firebase.
#
# ci.yml calls this when a pull request changes a file in its area
# (scripts/lib/ciAreas.mjs), and on every push to main. The large-text sweep,
# half of the browser time, runs in a job of its own.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-accessibility:
    runs-on: ubuntu-latest
    # 79 scenes at two sizes, 66 of them the teacher's and walked by Tab as well as audited (TT27), and the
    # contrast review replays the same scenes: at 61 scenes each took about twenty minutes on a busy two-core
    # machine, and the fifth slice's 18 add about a third. The job runs both and the drivers after them. A hung
    # run is still stopped, later than it was at 70.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      # Standalone harnesses (assignment tools, secure exam), served with
      # src/firebase.js and the Test Cycle / secure exam services swapped for
      # stubs (tests/browser/emulator/vite.config.mjs).
      - name: Start the standalone harness server
        run: |
          npx vite --config tests/browser/emulator/vite.config.mjs --host 127.0.0.1 --port 5199 --strictPort >/tmp/accessibility-vite.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:5199/tests/browser/accessibilitySecureExam.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/accessibility-vite.log; exit 1
      # The real app in memory (firebase/* faked, synthetic school), signed in
      # as a student, and as the synthetic teacher for the teacher screens.
      - name: Start the in-memory app harness
        run: |
          TEACHER_HARNESS_PORT=5188 npx vite --config tests/browser/accessibilityAppHarness.vite.config.mjs >/tmp/accessibility-app-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/accessibility-app-harness.log; exit 1
      - name: Certify WCAG 2.1 AA (ratchet)
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: npm run certify:accessibility
      # What a screen reader is given, read from Chromium's accessibility tree
      # (these harnesses import no Firebase, so the standalone server serves them).
      - name: Math is spoken once, in words
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/mathSpeech.mjs
      - name: Graphs are described, and say no feature value while answerable
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/graphDescription.mjs
      - name: Dialog focus, keyboard focus ring and the new-question announcement
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/accessiblePrimitives.mjs
      # The Tab walk of the teacher screens counts nothing unless it can be seen
      # finding something: thirteen pages, each wrong in one way, or right.
      - name: The Tab walk finds each planted keyboard defect (TT27)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/accessibilityKeyboardReachSelfTest.mjs
      # The two pop-ups of the teacher's Assignments screen, driven with the keys a keyboard
      # teacher presses (the ratchet's scenes open them; this presses what is in them).
      - name: The card menu and the class list by keyboard (TT27)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: node tests/browser/accessibilityTeacherMenus.mjs
      # Live Class's Room / Walkthrough / Attention: one Tab stop, the arrow keys, and a panel.
      - name: Live Class's tabs by keyboard (TT27)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: node tests/browser/accessibilityTeacherLiveClassTabs.mjs
      # The administrator's five section tabs: one Tab stop, the arrow keys, and a panel.
      - name: The administrator's tabs by keyboard (TT27)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: node tests/browser/accessibilityTeacherAdminTabs.mjs
      # A student's detail page: its seven views are a tab list (TT27, fifth slice), with the same keys.
      - name: A student's detail views by keyboard (TT27)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: node tests/browser/accessibilityTeacherStudentDetailTabs.mjs
      # The teacher workspace's one main landmark and its skip link, over every screen and the dialogs on top,
      # and the three states where a student's own screen runs inside it (the Test Cycle preview, a Demo
      # Experience session, a Path Simulator session), which used to draw a second main.
      - name: The teacher workspace's main landmark and skip link (TT27)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: node tests/browser/accessibilityTeacherLandmarks.mjs
      - name: The calculator by keyboard (Escape, focus return, Move)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/calculatorKeyboard.mjs
      - name: My Math Path and Recovery hosts (focus clear of the action bar, universal tools, graph descriptions)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/hostAccessibility.mjs
      - name: Log Out target size, every student target's size (WCAG 2.5.8), the Work View header at large text, and the Live Challenge host by keyboard
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: node tests/browser/studentShellLargeText.mjs --check=targets,s5,targetsize,workviewheader
      - name: Contrast over gradients (axe's undecided nodes, measured)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: npm run review:contrast
      - name: Mapping Diagram plot by keyboard (T1, T4)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/toolKeyboardRelationMapping.mjs
      - name: Three-plane model and choices by keyboard (T2, T7)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/toolKeyboardThreePlane.mjs
      - name: Number Line endpoints by keyboard (T3, T4)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/toolKeyboardNumberLine.mjs
      - name: Regression Add Item menu by keyboard (T5)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/toolKeyboardRegression.mjs
      - name: Residual table name and tool focus rings (T6, T8)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/toolKeyboardDataModelingAndSystemsCss.mjs
      - name: Live Challenge choices are a radio group; focus after Lock In (QA m4)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: node tests/browser/liveChallengeChoiceKeyboard.mjs
      - name: Closed-question verdict chip overlaps nothing (QA m7)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: node tests/browser/closedVerdictChip.mjs
      - name: Phone work bar primary label never truncated (QA m8)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: node tests/browser/workBarPrimaryLabel.mjs
      - name: My Math Path landmarks (QA m11)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: node tests/browser/myMathPathLandmarks.mjs
      - name: Home and Grades accessible names (QA m13)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: node tests/browser/studentAccessibleNames.mjs
      - name: A stale tab shows the recorded response once closed elsewhere (QA R2-m3)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: node tests/browser/staleTabRecord.mjs
      - name: Closed-DOL copy never contradicts itself (QA R2-m4)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: node tests/browser/dolCloseCopy.mjs
      - name: The unchanged-values confirm opens above Work View
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/unchangedConfirmWorkView.mjs
      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-certification
          path: tests/browser/artifacts/accessibility
          retention-days: 14

  # WCAG 1.4.4 / 1.4.10 / 1.4.12 at 200% text, 320px and text spacing: half
  # the browser time, so a runner of its own.
  browser-large-text:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      # Standalone harnesses (assignment tools, secure exam), served with
      # src/firebase.js and the Test Cycle / secure exam services swapped for
      # stubs (tests/browser/emulator/vite.config.mjs).
      - name: Start the standalone harness server
        run: |
          npx vite --config tests/browser/emulator/vite.config.mjs --host 127.0.0.1 --port 5199 --strictPort >/tmp/accessibility-vite.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:5199/tests/browser/accessibilitySecureExam.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/accessibility-vite.log; exit 1
      # The real app in memory (firebase/* faked, synthetic school), signed in
      # as a student.
      - name: Start the in-memory app harness
        run: |
          TEACHER_HARNESS_PORT=5188 npx vite --config tests/browser/accessibilityAppHarness.vite.config.mjs >/tmp/accessibility-app-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/accessibility-app-harness.log; exit 1
      # WCAG 1.4.4 / 1.4.10 / 1.4.12 after the px→rem sweep (student push N):
      # every scene (student screens, tools, Recovery, the teacher workspace)
      # at 200% browser text, at 320px and with text spacing — nothing
      # clipped, off screen or left unscaled.
      - name: Large text, reflow and text spacing
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: node tests/browser/studentShellLargeText.mjs --check=text
      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-certification-large-text
          path: tests/browser/artifacts/accessibility
          retention-days: 14

  # The teacher's 66 scenes at 200% text, at 320px and with text spacing (WCAG 1.4.4 / 1.4.10 / 1.4.12), and every
  # pointer target at 24px or the room the spacing exception asks for (2.5.8), at both viewports (TT27). A job of its
  # own: seven settings over 48 scenes took about fifty minutes on a busy two-core machine, and the fifth slice's 18
  # scenes add nearly forty per cent.
  browser-teacher-large-text:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the in-memory app harness
        run: |
          TEACHER_HARNESS_PORT=5188 npx vite --config tests/browser/accessibilityAppHarness.vite.config.mjs >/tmp/accessibility-app-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/accessibility-app-harness.log; exit 1
      - name: Teacher screens, large text and reflow
        env:
          PLAYWRIGHT_MODULE: playwright
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: node tests/browser/studentShellLargeText.mjs --check=text,targetsize --teacher
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-certification-teacher-large-text
          path: tests/browser/artifacts/large-text
          retention-days: 14

  # WCAG 2.2 2.4.11 (Focus Not Obscured) on the student's screens: the teacher screens' Tab walk through every student
  # scene at 1366×768 and 390×844 (a touch phone), then back with Shift+Tab, Work View with each of its drawers, My Math
  # Path's session and a DOL Recovery assessment; a stop mostly under something the page drew fails. A job of its own:
  # the forward walks alone took about eight minutes on a busy four-core machine (2026-11-06).
  browser-focus-not-obscured:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the standalone harness server
        run: |
          npx vite --config tests/browser/emulator/vite.config.mjs --host 127.0.0.1 --port 5199 --strictPort >/tmp/accessibility-vite.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:5199/tests/browser/accessibilitySecureExam.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/accessibility-vite.log; exit 1
      - name: Start the in-memory app harness
        run: |
          TEACHER_HARNESS_PORT=5188 npx vite --config tests/browser/accessibilityAppHarness.vite.config.mjs >/tmp/accessibility-app-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/accessibility-app-harness.log; exit 1
      - name: No focused control under something the page drew (WCAG 2.4.11)
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: node tests/browser/studentShellLargeText.mjs --check=obscured
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-certification-focus-obscured
          path: tests/browser/artifacts/large-text
          retention-days: 14
