name: Apply compound inequality number-line fix

on:
  push:
    branches:
      - fix/compound-inequality-number-line
    paths:
      - .github/workflows/apply-compound-inequality-number-line-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/compound-inequality-number-line
          fetch-depth: 0

      - name: Patch the V5 compiler
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/platform/contract/authoringIntentV5.js')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r"    case 'stepAlgebra':\n"
              r"      out = copyCommon\(q, \{\n"
              r"        type,\n"
              r"        equation: q\.equation,\n"
              r"        generator: q\.generator,\n"
              r"        workspaceDifficulty: q\.workspaceDifficulty,\n"
              r"        solveFor: q\.solveFor \|\| inferSingleEquationVariable\(q\.equation\),\n"
              r"      \}\);\n"
              r"      break;\n"
          )

          replacement = """    case 'stepAlgebra': {
            // solveStepByStep can be composed with constructInterval. Keep the
            // algebra workspace as the primary renderer, but preserve the
            // inequality and number-line contract instead of dropping it during
            // V5 intent compilation.
            const equation = q.equation || q.inequalityText || q.inequality;
            const intervals = asArray(q.intervals?.length ? q.intervals : q.intervalNumberLine?.intervals)
              .filter(isObject);
            const wantsIntervalGraph = actions.includes('constructInterval');
            out = copyCommon(q, {
              type,
              equation,
              inequalityText: q.inequalityText || q.inequality,
              intervals: wantsIntervalGraph && intervals.length ? intervals : undefined,
              intervalNumberLine: wantsIntervalGraph && intervals.length
                ? {
                    ...(isObject(q.intervalNumberLine) ? q.intervalNumberLine : {}),
                    intervals,
                  }
                : undefined,
              generator: q.generator,
              workspaceDifficulty: q.workspaceDifficulty,
              solveFor: q.solveFor || inferSingleEquationVariable(equation),
            });
            break;
          }
          """

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one stepAlgebra compiler block, found {count}; refusing unsafe patch.')
          path.write_text(updated, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Run focused V5 compiler regression test
        run: node tests/platform/authoringIntentV5.test.mjs

      - name: Commit compiler repair
        run: |
          git config user.name "MathMaster repair bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/platform/contract/authoringIntentV5.js
          git diff --cached --check
          git commit -m "fix: preserve solve-and-graph inequality data"
          git push origin HEAD:fix/compound-inequality-number-line
