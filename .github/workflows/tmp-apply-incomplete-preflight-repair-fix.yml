name: Temporary Incomplete Repair Patch

on:
  push:
    branches:
      - fix/incomplete-preflight-repair-identity
    paths:
      - .github/workflows/tmp-apply-incomplete-preflight-repair-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/incomplete-preflight-repair-identity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact source patch
        run: node scripts/tmp-apply-incomplete-preflight-repair-fix.mjs
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/AssignmentIntake.jsx src/components/teacher/IncompleteAssignmentRepairCenter.jsx src/platform/contract/questionBatchRepairPacket.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: align incomplete preview and repair selection"
          git push origin HEAD:fix/incomplete-preflight-repair-identity

# One-shot helper: remove this workflow after the source patch lands.