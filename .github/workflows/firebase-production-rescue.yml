name: Firebase Production Rescue

on:
  push:
    branches:
      - rescue/firebase-production-sync-20260924
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MATHMASTER_ALEKS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "::error::No Firebase deployment credential is configured. Expected FIREBASE_SERVICE_ACCOUNT_MATHMASTER_ALEKS or FIREBASE_TOKEN."
            exit 1
          fi

      - name: Build Firebase production runtime
        run: npm run build:firebase

      - name: Deploy Firebase Hosting
        env:
          FIREBASE_HOSTING_UPLOAD_CONCURRENCY: "4"
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy:hosting

      - name: Deploy updated grading and recovery functions
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --project mathmaster-aleks --only functions:ingestStudentSubmissions,functions:finalizeStudentResponseCheckpoints,functions:applyWorkspaceDraftRecovery
