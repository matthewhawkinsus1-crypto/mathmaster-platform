name: Full Platform Test Suite

concurrency:
  group: full-platform-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      # main is listed so the suite keeps guarding the branch itself after this
      # cleanup merges. Without it the only push coverage would be a branch that
      # stops existing, and main could go red again unnoticed between PRs.
      - main
      - fix/main-full-platform-suite-green
      - audit/teks-fidelity-v2-algebra2-current
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  full-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run every platform test
        run: node --test tests/platform/*.test.mjs

      - name: Run standalone tool tests
        run: node --test tests/tools/*.test.mjs

      - name: Run Firestore security-rule suites
        run: npm run test:rules

      - name: Verify certified Algebra shipping-seed parity
        run: node scripts/build-algebra-fidelity-v2-production-seeds.mjs --check

      - name: Audit certified Algebra release authority
        run: node scripts/audit-algebra1-path-release-authority.mjs --strict

      - name: Re-run strict Algebra adaptive metadata audit
        run: node scripts/audit-challenge-dok-difficulty-v2.mjs --strict

      - name: Re-run strict Algebra Challenge quality audit
        run: node scripts/audit-challenge-quality-v2.mjs --strict

      - name: Audit correct-answer acceptance
        run: npm run audit:answer-acceptance

      - name: Build standard web runtime
        if: always()
        run: npm run build

      - name: Build Firebase production web runtime
        if: always()
        run: npm run build:firebase

      - name: Lint
        if: always()
        run: npm run lint

  # SEPARATE JOB, AND NOT A STYLISTIC CHOICE. This suite needs functions/
  # installed, and that tree is 178MB — googleapis alone is 112MB. Inline in the
  # job above it added roughly fifteen minutes to every run, including runs that
  # touch none of this, and it delayed the signal everything else depends on.
  # Here it runs in parallel and pays that cost only for itself.
  live-challenge-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # Both lockfiles. Keyed on the root one alone, the functions tree was
          # never in the restored cache and downloaded cold every single run.
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm --prefix functions ci

      # Runs the real Cloud Functions against the Firestore emulator and reads
      # back what they wrote. Source assertions cannot tell a correct write from
      # a wrong field path.
      - name: Run Live Challenge integration suites
        timeout-minutes: 15
        run: npm run test:challenge-finish
