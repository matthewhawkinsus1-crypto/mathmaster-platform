name: One-shot live runtime integration polish

on:
  push:
    branches:
      - codex/finish-live-runtime-self-healing
    paths:
      - .github/workflows/one-shot-live-runtime-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/finish-live-runtime-self-healing
          fetch-depth: 0
      - name: Preserve missing-assignment semantics and key task refresh by question
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/App.jsx')
          source = app.read_text()
          source = source.replace(
              "  };  // Keep the literal Firestore record separate from the runtime compatibility",
              "  };\n\n  // Keep the literal Firestore record separate from the runtime compatibility",
              1,
          )
          old = """  const activeRuntimeRepair = useMemo(
            () => prepareAssignmentForRuntime(rawActiveAssignmentData || {}, { source: 'activeAssignmentPlayer' }),
            [rawActiveAssignmentData],
          );
          const activeAssignmentData = activeRuntimeRepair.assignment;"""
          new = """  const activeRuntimeRepair = useMemo(
            () => (rawActiveAssignmentData
              ? prepareAssignmentForRuntime(rawActiveAssignmentData, { source: 'activeAssignmentPlayer' })
              : null),
            [rawActiveAssignmentData],
          );
          const activeAssignmentData = activeRuntimeRepair?.assignment || null;"""
          if old not in source:
              raise SystemExit('App runtime preparation block not found')
          app.write_text(source.replace(old, new, 1))

          runner = Path('src/platform/workflow/WorkflowRunner.jsx')
          source = runner.read_text()
          old = """// A primitive signature lets the guidance effect notice a genuinely new
          // composed question without depending on workflow array identity. The latter
          // can be rebuilt by callers and previously caused render loops; omitting all
          // workflow content, however, let YOUR TASK stay blank/stale after navigation.
          const workflowGuidanceSignature = useMemo(() => JSON.stringify(
            (Array.isArray(authoredWorkflow) ? authoredWorkflow : []).map((stage) => ({
              id: stage?.id || null,
              kind: stage?.kind || null,
              prompt: stage?.prompt || null,
              label: stage?.label || null,
              showWhen: stage?.showWhen || null,
            })),
          ), [authoredWorkflow]);"""
          # The previous one-shot deliberately wrote a valid but unindented block.
          # Match both the actual unindented text and any formatter-adjusted variant.
          if old not in source:
              old = """  // A primitive signature lets the guidance effect notice a genuinely new
          // composed question without depending on workflow array identity. The latter
          // can be rebuilt by callers and previously caused render loops; omitting all
          // workflow content, however, let YOUR TASK stay blank/stale after navigation.
          const workflowGuidanceSignature = useMemo(() => JSON.stringify(
            (Array.isArray(authoredWorkflow) ? authoredWorkflow : []).map((stage) => ({
              id: stage?.id || null,
              kind: stage?.kind || null,
              prompt: stage?.prompt || null,
              label: stage?.label || null,
              showWhen: stage?.showWhen || null,
            })),
          ), [authoredWorkflow]);"""
          new = """  // A primitive signature lets the guidance effect notice a genuinely new
          // composed question without depending on workflow array identity. Include the
          // authored question key because two recipe-generated questions may have the
          // same stage prompts; navigation between them must still republish YOUR TASK.
          const workflowGuidanceSignature = useMemo(() => JSON.stringify({
            questionKey: question?.questionId || question?.id || question?.prompt || null,
            stages: (Array.isArray(authoredWorkflow) ? authoredWorkflow : []).map((stage) => ({
              id: stage?.id || null,
              kind: stage?.kind || null,
              prompt: stage?.prompt || null,
              label: stage?.label || null,
              showWhen: stage?.showWhen || null,
            })),
          }), [question?.questionId, question?.id, question?.prompt, authoredWorkflow]);"""
          if old not in source:
              raise SystemExit('WorkflowRunner guidance signature block not found')
          runner.write_text(source.replace(old, new, 1))

          Path('.github/workflows/one-shot-live-runtime-polish.yml').unlink()
      - name: Commit polished integration and remove one-shot workflow
        run: |
          git config user.name "mathmaster-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx src/platform/workflow/WorkflowRunner.jsx .github/workflows/one-shot-live-runtime-polish.yml
          git commit -m "fix: preserve live assignment and task refresh semantics"
          git push origin HEAD:codex/finish-live-runtime-self-healing
