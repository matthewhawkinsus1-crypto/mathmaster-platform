name: One-shot live runtime integration polish

on:
  push:
    branches:
      - codex/finish-live-runtime-self-healing
    paths:
      - .github/workflows/one-shot-live-runtime-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/finish-live-runtime-self-healing
          fetch-depth: 0
      - name: Preserve missing-assignment semantics and key task refresh by question
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('src/App.jsx')
          source = app.read_text()
          source = source.replace(
              "  };  // Keep the literal Firestore record separate from the runtime compatibility",
              "  };\n\n  // Keep the literal Firestore record separate from the runtime compatibility",
              1,
          )
          pattern = re.compile(
              r"(?P<indent>^[ \t]*)const activeRuntimeRepair = useMemo\(\s*"
              r"\(\) => prepareAssignmentForRuntime\(rawActiveAssignmentData \|\| \{\}, \{ source: 'activeAssignmentPlayer' \}\),\s*"
              r"\[rawActiveAssignmentData\],\s*"
              r"\);\s*"
              r"const activeAssignmentData = activeRuntimeRepair\.assignment;",
              re.MULTILINE,
          )
          match = pattern.search(source)
          if not match:
              raise SystemExit('App runtime preparation block not found')
          indent = match.group('indent')
          replacement = "\n".join([
              f"{indent}const activeRuntimeRepair = useMemo(",
              f"{indent}  () => (rawActiveAssignmentData",
              f"{indent}    ? prepareAssignmentForRuntime(rawActiveAssignmentData, {{ source: 'activeAssignmentPlayer' }})",
              f"{indent}    : null),",
              f"{indent}  [rawActiveAssignmentData],",
              f"{indent});",
              f"{indent}const activeAssignmentData = activeRuntimeRepair?.assignment || null;",
          ])
          app.write_text(source[:match.start()] + replacement + source[match.end():])

          runner = Path('src/platform/workflow/WorkflowRunner.jsx')
          source = runner.read_text()
          start_marker = '// A primitive signature lets the guidance effect notice a genuinely new'
          end_marker = '), [authoredWorkflow]);'
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('WorkflowRunner guidance signature start not found')
          line_start = source.rfind('\n', 0, start) + 1
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('WorkflowRunner guidance signature end not found')
          end += len(end_marker)
          indent = '  '
          replacement = "\n".join([
              f"{indent}// A primitive signature lets the guidance effect notice a genuinely new",
              f"{indent}// composed question without depending on workflow array identity. Include the",
              f"{indent}// authored question key because two recipe-generated questions may have the",
              f"{indent}// same stage prompts; navigation between them must still republish YOUR TASK.",
              f"{indent}const workflowGuidanceSignature = useMemo(() => JSON.stringify({{",
              f"{indent}  questionKey: question?.questionId || question?.id || question?.prompt || null,",
              f"{indent}  stages: (Array.isArray(authoredWorkflow) ? authoredWorkflow : []).map((stage) => ({{",
              f"{indent}    id: stage?.id || null,",
              f"{indent}    kind: stage?.kind || null,",
              f"{indent}    prompt: stage?.prompt || null,",
              f"{indent}    label: stage?.label || null,",
              f"{indent}    showWhen: stage?.showWhen || null,",
              f"{indent}  }})),",
              f"{indent}}}), [question?.questionId, question?.id, question?.prompt, authoredWorkflow]);",
          ])
          runner.write_text(source[:line_start] + replacement + source[end:])

          Path('.github/workflows/one-shot-live-runtime-polish.yml').unlink()
      - name: Commit polished integration and remove one-shot workflow
        run: |
          git config user.name "mathmaster-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx src/platform/workflow/WorkflowRunner.jsx .github/workflows/one-shot-live-runtime-polish.yml
          git commit -m "fix: preserve live assignment and task refresh semantics"
          git push origin HEAD:codex/finish-live-runtime-self-healing
