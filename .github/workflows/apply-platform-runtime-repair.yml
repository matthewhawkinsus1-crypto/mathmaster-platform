name: Apply platform runtime repair

on:
  push:
    branches:
      - codex/platform-question-runtime-repair
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/codex/platform-question-runtime-repair'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/platform-question-runtime-repair
          fetch-depth: 0

      - name: Apply exact source transforms
        run: node scripts/apply-platform-runtime-repair.mjs

      - name: Remove one-time repair machinery
        run: |
          rm scripts/apply-platform-runtime-repair.mjs
          rm .github/workflows/apply-platform-runtime-repair.yml

      - name: Commit platform repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/problemGenerator.js src/QuestionEngine.jsx src/platform/workflow/WorkflowRunner.jsx scripts/apply-platform-runtime-repair.mjs .github/workflows/apply-platform-runtime-repair.yml
          git diff --cached --check
          git commit -m "fix: harden generated question runtime and workflow presentation"
          git push origin HEAD:codex/platform-question-runtime-repair
