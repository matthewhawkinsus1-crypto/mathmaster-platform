name: Codex Platform Question Runtime Repair

on:
  push:
    branches:
      - codex/platform-question-runtime-repair

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/platform-question-runtime-repair
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact-anchor runtime repair
        run: node scripts/apply-platform-question-runtime-repair.mjs

      - name: Run targeted platform regressions
        run: >-
          node --test
          tests/platform/pathQuestionGenerationDependency.test.mjs
          tests/platform/questionGenerationContainment.test.mjs
          tests/platform/workflowPresentationRuntime.test.mjs
          tests/platform/workflowFocusMode.test.mjs
          tests/platform/v5ExplicitWorkflowRepairRegression.test.mjs

      - name: Build production client
        run: npm run build

      - name: Commit verified runtime changes
        shell: bash
        run: |
          if git diff --quiet -- src/problemGenerator.js src/platform/workflow/WorkflowRunner.jsx src/components/student/MobileViewportContainer.jsx; then
            echo "No runtime changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/problemGenerator.js src/platform/workflow/WorkflowRunner.jsx src/components/student/MobileViewportContainer.jsx
          git commit -m "fix: contain generated questions and preserve workflow evidence"
          git push origin HEAD:codex/platform-question-runtime-repair
