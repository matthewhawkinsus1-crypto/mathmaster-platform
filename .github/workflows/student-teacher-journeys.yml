name: Student and Teacher Journeys

# The end-to-end journeys that used to run only by hand (deep dive 2026-10-01
# §13): the real App.jsx and the real student runtime, driven in Chromium, with
# every `firebase/*` import replaced by in-memory fakes or a harness — nothing
# can reach a Firebase project, and every school is synthetic.
#
#   teacher journeys       tests/browser/teacherWorkflow/journeys.mjs
#                          (today's lesson -> progress -> grades -> Live view,
#                          DOL fire drill, moving classwork, exports)
#   support evidence       tests/browser/teacherWorkflow/supportEvidenceJourneys.mjs
#   case review            tests/browser/teacherWorkflow/caseReviewJourneys.mjs
#   walkthrough scope      tests/browser/teacherWorkflow/walkthroughJourneys.mjs
#                          (only the selected class's live assignments; class
#                          switch; empty state; a stale saved session retired)
#   district ID correction tests/browser/teacherWorkflow/districtIdJourneys.mjs
#                          (its own job: an account made under a mistyped
#                          number gets its real district ID in Student
#                          Access; nothing else about the student changes;
#                          every Grade Export file — update, re-export, new
#                          lesson — then carries the corrected ID; a second
#                          student cannot take it; she signs in as before)
#   extra time on the DOL  tests/browser/teacherWorkflow/dolExtraTimeJourneys.mjs
#                          (D7: a student with extra time keeps working after
#                          the class's DOL closed and reads their own close;
#                          a classmate's is closed; Live view lists who)
#   private controls       tests/browser/teacherWorkflow/privateControlsJourneys.mjs
#                          (its own job: one own-controls listener per student,
#                          one class listener per teacher; a shared Chromebook
#                          A -> B; DOL grants through the callable; the staged
#                          Stage 4 migration; desktop, Chromebook, iPad, phone)
#   cross-device drafts    tests/browser/teacherWorkflow/draftCrossDeviceJourneys.mjs
#                          (a fresh, slow or offline Chromebook gets the work
#                          and never overwrites it; the newest edit wins)
#   restored-draft focus   tests/browser/teacherWorkflow/restoredDraftFocusRaceJourneys.mjs
#                          (its own job: once the student clicks, taps or keys
#                          after a cross-device restore, no late focus — the
#                          restore's frame, MathLive's 60 ms timer — moves the
#                          cursor; held deterministically, then raced many
#                          times; Chromebook, iPad, phone; 50x/20x nightly)
#   Warm-Up reopen         tests/browser/teacherWorkflow/warmupReopenJourneys.mjs
#                          (lmr-wu-1: partial work, timer close, teacher reopen,
#                          resume, submit; malformed drafts; a second board;
#                          and with the harness server — Checks ingested, the
#                          deadline auto-submit closing Q1, the reopen, a
#                          refresh, another Chromebook; throttled nightly, in
#                          four jobs of its own) and, on QuestionEngine alone,
#                          tests/browser/warmupReopenDraft.mjs
#   held Recovery         tests/browser/teacherWorkflow/recoveryHoldJourneys.mjs
#                          (a Recovery question MathMaster could not grade:
#                          never counted wrong, left out or held, Pending
#                          Grade; the teacher finalizes or issues a
#                          replacement; Chromebook, iPad, phone; throttled
#                          nightly)
#   Recovery answers       tests/browser/teacherWorkflow/recoveryDraftCrossDeviceJourneys.mjs
#   across Chromebooks     (answers saved on one Chromebook are on the next,
#                          and graded on Submit there; offline says "this
#                          device only" until it syncs; Chromebook, phone)
#   family pin containment tests/browser/familyPinContainment.mjs
#                          (a Question Family pin that will not replay is one
#                          question's failure: never a substitute question,
#                          never an app crash; student, teacher preview,
#                          Recovery; throttled nightly)
#   student UX platform    tests/browser/studentUxPlatform.mjs
#   representations board  tests/browser/linearMultipleRepresentations.mjs
#   process mode           tests/browser/lmrProcessMode.mjs
#                          (the same board's facts established by a process,
#                          verified, reused, then built on)
#   prerequisite early     tests/browser/teacherWorkflow/prerequisiteEarlyJourneys.mjs
#                          (a met prerequisite opens Classwork and Practice,
#                          the server accepts the answer; Warm-Up and DOL stay
#                          shut; without it the lesson still opens later)
#   endurance (nightly)    tests/browser/teacherWorkflow/enduranceJourneys.mjs
#   submit and finish      tests/browser/teacherWorkflow/submitAndFinishJourneys.mjs
#                          (its own job: Submit names the try it spends, the
#                          last try and one try; the save line calls a draft a
#                          draft and an answer an answer, also after a reload,
#                          and its live region stays silent unless the student
#                          must act; finishing lands on the results page; a
#                          skipped question is the way back; Enter and focus
#                          after a closed question; Chromebook and phone)
#   Honors version         tests/browser/teacherWorkflow/honorsCcmrJourneys.mjs
#                          (its own job: a lesson imported for a Standard and
#                          an Honors class; the audited CCMR item that failed
#                          Create in production is caught in Review with its
#                          failure, a validated item takes its place, is
#                          previewed as a student and swapped on request; a
#                          failed save writes nothing; Create writes exactly
#                          the two versions previewed; when no item passes,
#                          the teacher's decision is recorded; a failed bank
#                          call recovers with Try again; desktop, Chromebook,
#                          phone; the bank answered by functions/lib)
#                          tests/browser/teacherWorkflow/dol2ReviewHonorsJourneys.mjs
#                          (same job: the Algebra II Honors DOL #2 review,
#                          which carries its own audited CCMR, given to a
#                          Standard and an Honors Algebra II class: Review says
#                          the Honors version is ready with nothing replaced,
#                          both versions preview, and Create writes both, each
#                          the whole review; desktop, Chromebook, phone)
#   real URLs              tests/browser/teacherWorkflow/appUrlJourneys.mjs
#                          (its own job: refresh on every student screen and
#                          question, Back/Forward Home -> question -> Grades,
#                          a deep link through sign-in, another class's or
#                          student's address shows nothing, Log Out returns
#                          to /, a teacher's tab and monitor; desktop, phone)
#   screen changes         tests/browser/teacherWorkflow/studentScreenChange.mjs
#                          (same job: focus and the spoken name on a screen
#                          change, one main per screen, Back by origin, the
#                          one-row phone nav, Assignments' filters kept)
#   pass 3 student journeys (job pass3-student-journeys; they ran by hand
#                          only until wave 7):
#                          tests/browser/teacherWorkflow/assignmentChromeJourneys.mjs
#                          (the assignment chrome; the lobby invite inside a
#                          lesson, NAV-25), studentNameJourneys.mjs (one name
#                          per student everywhere), draftSaveNoticeReloadJourneys.mjs
#                          (W7-3: a draft-save notice survives a reload),
#                          phoneSaveLineJourneys.mjs (W7-8: on every phone
#                          layout the save line and the problem notice are
#                          seen), askMyTeacherJourneys.mjs
#                          (Ask my teacher answers back). Ask my teacher and the
#                          lobby's way into the game run on the accessibility
#                          App harness, on port 5189
#
# Pull requests that touch the app run the journeys (ci.yml calls this when a
# file in its area changes: scripts/lib/ciAreas.mjs). The throttled runs and
# the long endurance run are nightly and on demand, each in a job of its own
# (teacher-nightly-*), so they have the time to finish. Read-only: this
# workflow writes nothing back.

on:
  workflow_call:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The teacher journeys, in three jobs of about ten minutes each: one runner
  # took 29 minutes for them all (PR #513), against a 40-minute limit.
  teacher:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the teacher harness
        run: |
          npx vite --config tests/browser/teacherWorkflow/vite.config.mjs >/tmp/teacher-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/teacher-harness.log; exit 1
      - name: Teacher workflow journeys
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/teacherWorkflow/journeys.mjs
      - name: Support evidence journeys
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/teacherWorkflow/supportEvidenceJourneys.mjs
      - name: Walkthrough offers only the selected class's live work
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/teacherWorkflow/walkthroughJourneys.mjs
      - name: A prerequisite met early opens Classwork and Practice (and nothing timed)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/teacherWorkflow/prerequisiteEarlyJourneys.mjs
      - name: Extra time on the exit ticket (D7) — the student's own window, and the teacher's Live view
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/teacherWorkflow/dolExtraTimeJourneys.mjs
      - name: Recovery answers saved on one Chromebook, submitted from another
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/teacherWorkflow/recoveryDraftCrossDeviceJourneys.mjs

  # Case review and held Recovery, on a runner of their own (see teacher).
  teacher-case-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the teacher harness
        run: |
          npx vite --config tests/browser/teacherWorkflow/vite.config.mjs >/tmp/teacher-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/teacher-harness.log; exit 1
      - name: Case review journeys
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/teacherWorkflow/caseReviewJourneys.mjs
      - name: Held Recovery — a question MathMaster could not grade
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/teacherWorkflow/recoveryHoldJourneys.mjs

  # Unfinished work across Chromebooks and the Warm-Up reopen (see teacher).
  teacher-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the teacher harness
        run: |
          npx vite --config tests/browser/teacherWorkflow/vite.config.mjs >/tmp/teacher-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/teacher-harness.log; exit 1
      - name: Unfinished work across Chromebooks
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/teacherWorkflow/draftCrossDeviceJourneys.mjs
      - name: Warm-Up close and reopen under unfinished work
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/teacherWorkflow/warmupReopenJourneys.mjs

  # The throttled and endurance runs, nightly and on demand, each on a runner
  # of its own. In the teacher job they ran past its 40-minute limit every
  # night from at least Oct 13 to Oct 22: the run was cancelled before
  # Endurance began, and a cancelled nightly was never reported.
  #
  # The throttled Warm-Up close and reopen is ten journeys, and alone on a
  # runner it still ran past 45 minutes (issue #522: Oct 23 and Oct 24). On the
  # Chromebook every reload costs about four minutes (the dev server's modules
  # come over the slowed network) and the journeys reload fifteen times. Run
  # 39954965481 (Oct 23), in minutes: inprogress 6, submitted 1, pristine 0.3,
  # corrupt 21 (five reloads), cycles 0.6, bridge 6, and bridge-corrupt (five
  # reloads, 4.4 each) was cancelled in its third. So they run as four jobs
  # with 45 minutes each, about 14, 21, 22 and 22 of work (the last was timed
  # on a development machine: no CI run has got as far as the server journeys).
  # `only` is the driver's ONLY list, and tests/platform/nightlyWarmupShards.test.mjs
  # keeps every journey in exactly one job.
  teacher-nightly-warmup:
    name: teacher-nightly-warmup (${{ matrix.shard.name }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: reopen, only: "inprogress,submitted,pristine,cycles,bridge" }
          - { name: bad-drafts, only: "corrupt" }
          - { name: bad-board-drafts, only: "bridge-corrupt" }
          - { name: server, only: "server-expired,server-attempted,server-correct" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the teacher harness
        run: |
          npx vite --config tests/browser/teacherWorkflow/vite.config.mjs >/tmp/teacher-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/teacher-harness.log; exit 1
      - name: Warm-Up close and reopen, throttled Chromebook (nightly and on demand)
        env:
          PLAYWRIGHT_MODULE: playwright
          ONLY: ${{ matrix.shard.only }}
        run: node tests/browser/teacherWorkflow/warmupReopenJourneys.mjs --slow

  teacher-nightly-held-recovery:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the teacher harness
        run: |
          npx vite --config tests/browser/teacherWorkflow/vite.config.mjs >/tmp/teacher-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/teacher-harness.log; exit 1
      - name: Held Recovery, throttled Chromebook (nightly and on demand)
        env:
          PLAYWRIGHT_MODULE: playwright
        run: VIEWPORTS=1366x768 node tests/browser/teacherWorkflow/recoveryHoldJourneys.mjs --slow

  teacher-nightly-endurance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the teacher harness
        run: |
          npx vite --config tests/browser/teacherWorkflow/vite.config.mjs >/tmp/teacher-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/teacher-harness.log; exit 1
      - name: Endurance (nightly and on demand)
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/teacherWorkflow/enduranceJourneys.mjs

  # Its own runner: the teacher job is near its time limit. About a minute:
  # one journey, desktop and phone.
  district-id:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the teacher harness
        run: |
          npx vite --config tests/browser/teacherWorkflow/vite.config.mjs >/tmp/teacher-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/teacher-harness.log; exit 1
      - name: Correct a district ID typed wrong at account creation, through to the TEAMS file
        env:
          PLAYWRIGHT_MODULE: playwright
          VIEWPORTS: "1440x900,390x844"
        run: node tests/browser/teacherWorkflow/districtIdJourneys.mjs

  # Its own runner: the teacher job is near its time limit. About six
  # minutes: four journeys on desktop, Chromebook and phone.
  honors-ccmr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the teacher harness
        run: |
          npx vite --config tests/browser/teacherWorkflow/vite.config.mjs >/tmp/teacher-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/teacher-harness.log; exit 1
      - name: The Honors version is proven in Review and Create publishes exactly it
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/teacherWorkflow/honorsCcmrJourneys.mjs
      - name: A review that carries its own audited CCMR creates a ready Standard and Honors version
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/teacherWorkflow/dol2ReviewHonorsJourneys.mjs

  # Its own runner: the teacher job is near its time limit. One journey,
  # 1366x768 and 390x844.
  submit-and-finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the teacher harness
        run: |
          npx vite --config tests/browser/teacherWorkflow/vite.config.mjs >/tmp/teacher-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/teacher-harness.log; exit 1
      - name: Submit names its cost, the save line tells draft from answer, finishing lands on the results
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/teacherWorkflow/submitAndFinishJourneys.mjs

  # Its own runner: the teacher job is near its time limit, and these journeys
  # run every device size in both storage states (mirrored, retired).
  private-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the teacher harness
        run: |
          npx vite --config tests/browser/teacherWorkflow/vite.config.mjs >/tmp/teacher-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/teacher-harness.log; exit 1
      - name: Students' private assignment controls (listeners, shared Chromebook, DOL, staged migration)
        env:
          PLAYWRIGHT_MODULE: playwright
          # Desktop, Chromebook, iPad and phone (the last two as touch devices).
          VIEWPORTS: "1440x900,1366x768,820x1180,390x844"
        run: node tests/browser/teacherWorkflow/privateControlsJourneys.mjs

  # Its own runner: every journey runs on a Chromebook, an iPad and a phone,
  # and the nightly run races the restore 50 times at normal speed and 20
  # times throttled.
  restored-draft-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the teacher harness
        run: |
          npx vite --config tests/browser/teacherWorkflow/vite.config.mjs >/tmp/teacher-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/teacher-harness.log; exit 1
      - name: A restored draft's late focus never beats the student (Chromebook, iPad, phone)
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/teacherWorkflow/restoredDraftFocusRaceJourneys.mjs
      - name: The race 50 times at normal speed, 20 throttled (nightly and on demand)
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          PLAYWRIGHT_MODULE: playwright
          ONLY: repeat
          DEVICES: chromebook
          REPEAT: "50"
          THROTTLED_REPEAT: "20"
        run: node tests/browser/teacherWorkflow/restoredDraftFocusRaceJourneys.mjs

  # Its own runner: the teacher job is near its time limit. A few minutes:
  # every student screen reloaded, on a Chromebook and a phone.
  app-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the teacher harness
        run: |
          npx vite --config tests/browser/teacherWorkflow/vite.config.mjs >/tmp/teacher-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/teacher-harness.log; exit 1
      - name: Real URLs — refresh, Back/Forward, deep links, and what an address may reach
        env:
          PLAYWRIGHT_MODULE: playwright
          VIEWPORTS: "1366x768,390x844"
        run: node tests/browser/teacherWorkflow/appUrlJourneys.mjs
      # Student pass 3 (NAV-3, NAV-9, NAV-13, NAV-15): focus and the spoken
      # name on every screen change, one main per screen, Back by origin,
      # the one-row phone nav, Assignments' filters kept for Back.
      - name: Screen changes, landmarks and the phone nav
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          VIEWPORTS: "1366x768,390x844"
        run: node tests/browser/teacherWorkflow/studentScreenChange.mjs

  # The student journeys on the plain dev server, in two jobs (one runner took
  # 17 minutes for them all).
  student:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the student harness server
        run: |
          npx vite --host 127.0.0.1 --port 5199 --strictPort >/tmp/student-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5199/tests/browser/studentUxPlatform.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/student-harness.log; exit 1
      - name: Student UX platform journeys
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/studentUxPlatform.mjs
      - name: Warm-Up reopen on QuestionEngine (final and family-backed lmr-wu-1)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: |
          node tests/browser/warmupReopenDraft.mjs
          node tests/browser/warmupReopenDraft.mjs --family
      - name: Question Family pin containment (student, preview, Recovery)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/familyPinContainment.mjs
      # Hints, miss messages and worked solutions in the real QuestionEngine,
      # including the transformations / quadratics families (student push J).
      - name: Feedback that teaches (hints, families, worked solutions)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/feedbackTeaches.mjs
      # Read aloud says the whole question (choices, matrices, parts heard
      # again) and Translate shows Spanish or says why not (student pass 3, batch 6).
      - name: Read aloud and Translate (heard and seen)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/readAloudTranslate.mjs
      # Review My Work on a closed assignment (answers, outcomes, worked solutions).
      - name: Review My Work
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/reviewMyWork.mjs
      - name: Question Family pin containment, throttled Chromebook (nightly and on demand)
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/familyPinContainment.mjs --slow

  # The representations board, and its Process Mode (see student).
  student-representations:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the student harness server
        run: |
          npx vite --host 127.0.0.1 --port 5199 --strictPort >/tmp/student-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5199/tests/browser/studentUxPlatform.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/student-harness.log; exit 1
      - name: Representations board journeys
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/linearMultipleRepresentations.mjs
      - name: Representations board Process Mode journeys
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/lmrProcessMode.mjs

  # Student pass 3's journeys in the real App. Their own job: the teacher job
  # is near its limit. About 6 minutes locally.
  pass3-student-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the teacher harness
        run: |
          npx vite --config tests/browser/teacherWorkflow/vite.config.mjs >/tmp/teacher-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/teacher-harness.log; exit 1
      # The accessibility App harness: the same App and fixture, with snapshot
      # metadata filled in so a Live Challenge screen renders. Ask my teacher
      # and the lobby invite's way into the game run on it.
      - name: Start the accessibility App harness
        run: |
          TEACHER_HARNESS_PORT=5189 npx vite --config tests/browser/accessibilityAppHarness.vite.config.mjs >/tmp/accessibility-app-harness.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5189/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/accessibility-app-harness.log; exit 1
      - name: The assignment's chrome, and the Live Challenge lobby invite inside a lesson
        env:
          PLAYWRIGHT_MODULE: playwright
          LIVE_CHALLENGE_HARNESS_ORIGIN: "http://127.0.0.1:5189"
        run: node tests/browser/teacherWorkflow/assignmentChromeJourneys.mjs
      - name: Every surface names every student the same way
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/teacherWorkflow/studentNameJourneys.mjs
      - name: A draft-save notice survives a reload
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/teacherWorkflow/draftSaveNoticeReloadJourneys.mjs
      - name: On a phone the save line and the draft-save notice are seen
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/teacherWorkflow/phoneSaveLineJourneys.mjs
      - name: Ask my teacher answers back, and a raised hand is seen
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5189"
        run: node tests/browser/teacherWorkflow/askMyTeacherJourneys.mjs
