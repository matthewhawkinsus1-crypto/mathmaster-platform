name: Math Entry Contract

# Types on a real keyboard into the real MathInput and calculator (real
# MathLive) and checks the structure built — the contract in
# src/platform/math/typedFractionEntry.js. Node tests drive the state machine
# against a model of MathLive; this proves the installed MathLive agrees.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/MathInput.jsx"
      - "src/components/CalculatorPanel.jsx"
      - "src/components/calculatorKeypadFlow.js"
      - "src/platform/math/**"
      - "src/platform/interaction/mathFieldFocusHandoff.js"
      - "src/platform/interaction/fieldEchoGuard.js"
      - "tests/browser/mathEntryContract*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/math-entry-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: math-entry-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  math-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start the harness
        run: |
          npx vite --host 127.0.0.1 --port 5199 --strictPort >/tmp/math-entry-vite.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:5199/tests/browser/mathEntryContract.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/math-entry-vite.log; exit 1
      - name: Type every case on a real keyboard
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/mathEntryContract.mjs
