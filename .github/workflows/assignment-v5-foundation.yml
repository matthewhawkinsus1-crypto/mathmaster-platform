name: Assignment V5 Foundation

on:
  push:
    branches:
      - assignment-v5-canonical
  pull_request:
    branches:
      - main
    paths:
      - 'src/assignmentBlueprint.js'
      - 'src/App.jsx'
      - 'tests/platform/preproductionReset.test.mjs'
      - 'src/components/admin/PreproductionReset.jsx'
      - 'src/auth/authService.js'
      - 'functions/lib/admin.js'
      - 'src/AssignmentIntake.jsx'
      - 'src/components/teacher/assignmentCreatorPlan.js'
      - 'src/platform/contract/**'
      - 'src/platform/curriculum/instructionalScope.js'
      - 'src/platform/authoring/**'
      - 'src/platform/resources/**'
      - 'src/components/teacher/TeacherAssignmentPdfDialog.jsx'
      - 'src/components/teacher/LessonPreflightModal.jsx'
      - 'src/components/teacher/SectionBalanceRigorAudit.jsx'
      - 'src/platform/preflight/**'
      - 'src/platform/interaction/**'
      - 'src/platform/grading/**'
      - 'src/MathInput.jsx'
      - 'src/components/student/PathResponseFields.jsx'
      - 'functions/lib/mathPath.js'
      - 'functions/index.js'
      - 'functions/lib/assignmentAi.js'
      - 'functions/lib/config.js'
      - 'src/services/assignmentAiService.js'
      - 'tests/platform/assignmentAiProvider.test.mjs'
      - 'tests/platform/assignmentIntegratedAiWiring.test.mjs'
      - 'functions/lib/activityFeedback.js'
      - 'functions/lib/assignmentRuntime.js'
      - 'tests/platform/assignmentRuntimeProjection.test.mjs'
      - 'tests/platform/classroomFeedbackPolicy.test.mjs'
      - 'src/platform/publishing/**'
      - 'src/platform/quality/sectionBalanceRigor.js'
      - 'tests/platform/assignment*V5*.test.mjs'
      - 'tests/platform/assignmentCreator*.test.mjs'
      - 'tests/platform/assignmentWorksheetPdf*.test.mjs'
      - 'tests/platform/authoring*.test.mjs'
      - 'tests/platform/honorsCcmrAuthoringV5.test.mjs'
      - 'tests/platform/digitalSatV21AuthoringGate.test.mjs'
      - 'scripts/validate-authoring-v5.mjs'
      - 'scripts/audit-assignment-authoring-boundary.mjs'
      - 'scripts/audit-legacy-assignment-source.mjs'
      - 'src/platform/schemas/**'
      - 'src/platform/validation/**'
      - 'tests/platform/noLegacyBundleAuthoring.test.mjs'
      - 'tests/platform/noLegacyQuestionSchema.test.mjs'
      - 'teacher-import-jsons/**'
      - 'content/generated/**'
      - 'SAMPLE_*ASSIGNMENT*.json'
      - 'SAMPLE_*LESSON*.json'
      - 'SAMPLE_*AUTHORING*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/assignment-v5-foundation.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Canonical V5 tests
        run: npm run test:authoring-v5

      - name: Permanent V5 validator
        run: npm run validate:authoring-v5

      - name: Legacy authoring boundary audit
        run: npm run audit:assignment-authoring-boundary

      - name: Retired assignment source audit
        run: npm run audit:legacy-assignment-source

      - name: Pre-production reset safety
        run: node --test tests/platform/preproductionReset.test.mjs

      - name: PDF and worksheet regressions
        run: >
          node --test
          tests/platform/assignmentWorksheetPdf.test.mjs
          tests/platform/assignmentWorksheetPdfIntegration.test.mjs
          tests/platform/teacherAssignmentWorksheetExport.test.mjs
          tests/platform/teacherAssignmentPdfWiring.test.mjs

      - name: Digital SAT V2.1 authoring gate
        run: node --test tests/platform/digitalSatV21AuthoringGate.test.mjs

      - name: Production build
        run: npm run build
