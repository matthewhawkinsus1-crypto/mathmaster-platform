name: Live Challenge Option B

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Real games and real reward flows in Chromium, against the Firestore
  # emulator and the real callable handlers (each driver starts the emulator,
  # a callable bridge and Vite itself): a student's teaching screens (worked
  # solution, held solution, missed round, recap, nobody publicly last), the
  # projector's privacy (top few, never a last place, no word about extended
  # time), and class rewards for a student and a teacher at 1366x768 and
  # 390x844. Each exits 1 on any failed check.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - run: npm --prefix functions ci
      - name: Class rewards (student and teacher)
        env:
          PLAYWRIGHT_MODULE: playwright
        run: npm run test:class-rewards-browser
      - name: Live Challenge teaching journeys (student)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
        run: npm run test:live-challenge-teaching-browser
      - name: Live Challenge projector privacy
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
        run: npm run test:live-challenge-projector-privacy-browser

