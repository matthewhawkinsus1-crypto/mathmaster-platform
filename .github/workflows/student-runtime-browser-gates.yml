name: Student Runtime Browser Gates

# Fast browser gates over the real student runtime (real React, real
# MathLive), for the failures node tests cannot see:
#
#   mathEntryContract   types on a real keyboard into MathInput and the
#                       calculator and checks the structure MathLive built
#                       (src/platform/math/typedFractionEntry.js, PQ-040)
#   renderStability     mounts QuestionEngine the ways its hosts do and counts
#                       React commits while nothing happens: a render loop
#                       ("Maximum update depth exceeded") is hundreds of them;
#                       and a host re-render must not erase a student's step
#   errorRecovery       a chunk from an older build (a tab that outlived a
#                       deploy) and an ordinary bug, through the real error
#                       boundaries: recoverable screens, no reload loop
#   duplicateTabs       the same question in two tabs of one browser: the older
#                       tab pauses, and the newest work is the work kept
#   graphPointCheck     on a DOL, quiz or test the graph's point check never
#                       names a wrong point; a point plot is graded as placed
#   undoTyping          one platform Undo takes back a run of typing, not one
#                       character; a math field's own Ctrl+Z agrees with it
#   toolFocusAndUndo    every tool that gained Universal Undo (pass 3, TOOL-2)
#                       walks back to exactly what the student had, after a
#                       reload too, and never makes an attempt; a button that
#                       disables or removes itself never throws focus to the
#                       page (A11Y-2); the Regression Calculator's how-to and
#                       zoom (TOOL-9)
#   composedOutcomePolicy  a multi-step question on a DOL, quiz or test reveals
#                       nothing in any step (registry-tool steps, table->graph,
#                       "Your graph"), while practice keeps its feedback
#   toolPolicyGates     registry tools: no stage verdict and no hint where the
#                       activity withholds them; hints reveal and record
#   workViewHelpReach   on a 390x844 phone Work View's Help holds the tool's
#                       steps, "Show a hint" and "Ask my teacher"; on a DOL it
#                       holds Ask and no hint, no method card (TOOL-3, R-10)
#   relationPlotGrading a correct relation plot is graded correct, either way
#                       round for same-x cards; a DOL plot has no check
#   mathFontsProduction a PRODUCTION build serves the fonts its math fields
#                       draw with (the dev server hid that they were missing)
#   toolAttemptOutcome  after a tool's Check the attempt outcome is beside its
#                       verdict, on screen, announced once; none on a DOL (PQ-022)
#   assignmentGraphingCalculator  an assignment's calculator setting reaches the
#                       student: "graphing" opens a graphing calculator (enter
#                       f(x), trace, zeros, min, max) from the work bar and over
#                       Work View, records calculatorUsed, never submits on
#                       Enter; an exit ticket keeps the stricter rule; secure
#                       items and no setting unchanged (pass 3, PR-25/PR-26)
#   figureDescriptions  number lines, the 3D planes, the static question graph,
#                       the legacy graph workspace and the story sketch say what
#                       they show in the accessibility tree, follow the student's
#                       changes, and name nothing that answers a DOL (pass 3, Q-8);
#                       on a phone Undo and Reset keep their word (A11Y-10)
#   mathKeypadToolbar   MathInput's keypads are one Tab stop each: arrows, Home,
#                       End, named keys, focus back to the field (pass 3, PR-27)
#   workViewReference   "Information you need" is in Work View: its own drawer,
#                       inside Task on a phone, on a DOL too (pass 3, TOOL-12)
#   assessmentLeakGates nothing before Submit says whether work is right on a
#                       DOL, quiz or test (systems, inequalities, intercepts,
#                       relation solver, constraint builder); practice unchanged
#   systemsWorkspaceStudio  the systems-of-inequalities workspace one step at a
#                       time: every step still the student's to do and check,
#                       a wrong one held, a right one moving on, the graph on
#                       screen for every tap (Chromebook and phone), reload,
#                       keyboard plotting, the rewrite, Work View, contrast
#   clickMapLetterbox   number line, relation plot and story sketch place a tap
#                       where it lands on a letterboxed plane (PQ-034)
#   unansweredChoices   a judgment a tool asks for (how many solutions, direction,
#                       is it a factor) opens on "Choose…" and earns nothing
#                       unanswered
#   graphKeyboardRoute  the graph workspace's analysis fields are named by their
#                       part, and its keyboard route offers only what is there;
#                       a function graph and its inverse are finished by
#                       keyboard alone with "Connect my points" (TOOL-1)
#   planePhoneReach     on a phone the plane's text renders at 12 px or more, a
#                       press beside a point picks it up, and a third point keeps
#                       the line (pass 3, TOOL-11)
#   focusSafeToolControls  Start over, Reset view and Step Algebra's distribution
#                       targets keep keyboard focus when they disable themselves
#                       (pass 3, A11Y-2)
#   stagedQuestion      every step of a staged graph question, reached as a
#                       student reaches it on six screens: its question and its
#                       answer control on screen together, a plane big enough
#                       to mark, zoom offered, no coordinates printed where a
#                       later step asks for them
#   composedDraftRestore a composed question with a graph step reaches the
#                       server backup with no verdict in it, comes back on
#                       another device (the graph step re-derived when opened)
#                       and grades exactly as on the first (PQ-043), whether
#                       the server copy arrives before or after the question
#   draftEditTime       in every draft-certified family, opening a question
#                       stamps no draft; the student's edit does, and coming
#                       back or reloading keeps its time (PQ-044)
#   fractionTemplateGrading  a fraction key drawn from a template (a Question
#                       Family version, a Path-style template) is graded by one
#                       rule for every student: lowest terms or the key's own
#                       form, never the fraction the question showed (B-57)
#   moduleRecoveryLock  a closed question stays closed after its module fails:
#                       "Start this question fresh" can be pressed, and the
#                       fresh module, or the next item under one engine (My
#                       Math Path's mount, items with no id), closes again
#   closedQuestionEnter on a closed question Enter goes on only from the page:
#                       a summary, a button or an ARIA widget keeps its Enter
#   touchAfterScreenshot  an emulated phone, iPad and touch Chromebook still
#                       answer (pointer: coarse), (hover: none) and touch points
#                       after a screenshot that looks beyond the viewport. The
#                       browser takes touch away there; every phone driver takes
#                       such screenshots through tests/browser/support/
#                       touchEmulation.mjs, which puts it back (CI12, E1-18).
#                       It needs no server
#
# The gates above run in three jobs of about ten minutes each
# (student-runtime, -2, -3): one runner took 30 minutes for them all (PR #513).
#
# Student pass 3's own drivers, each in a job of its own size (they ran by
# hand only until wave 7):
#
#   pass3-student-screens and pass3-student-screens-2 (plain Vite, 5199)
#     submitNotQueued, toolDraftSyncSweep, matrixLabFeedback, afterLastMiss,
#     day1SystemsJourney, day2NonuniqueJourneys, assignmentMobile,
#     studentHomeToday, studentGradesRaise, studentResultUpNext,
#     studentWhatChanged, gradeCenterMobile; and wave 7's stepNotQueued
#     (W7-3), toolOutcomeReach and feedbackReasons2 (W7-4), toolChoiceGroups
#     (W7-2)
#   pass3-secure-screens (each starts its own stubbed Vite; nothing reaches
#     Firebase)
#     secureResults, secureExamNavigation, secureAccessParity
#   (testCycleRichToolQa and liveChallengeShellQa, which run the real
#   callables on the Firestore emulator, are in
#   student-pass3-emulator-journeys.yml: their own paths, and nightly)
#
# ci.yml calls this when a pull request changes a file in its area
# (scripts/lib/ciAreas.mjs), and on every push to main.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the harness server
        run: |
          npx vite --host 127.0.0.1 --port 5199 --strictPort >/tmp/student-runtime-vite.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:5199/tests/browser/renderStability.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/student-runtime-vite.log; exit 1
      - name: Math entry contract
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/mathEntryContract.mjs
      - name: Render stability
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/renderStability.mjs
      - name: Error recovery
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/errorRecovery.mjs
      - name: Duplicate tabs
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/duplicateTabs.mjs
      - name: Graph point check follows the feedback policy
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/graphPointCheck.mjs
      - name: On a phone every graph tool control can be reached by touch
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/phoneToolPanelReach.mjs
      - name: Undo groups typing and agrees with the math field
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/undoTyping.mjs
      - name: Every tool's Undo, and no press throws focus to the page
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/toolFocusAndUndo.mjs
      - name: A composed question follows the feedback policy in every step
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/composedOutcomePolicy.mjs
      - name: Registry tools follow the feedback and hint policy
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/toolPolicyGates.mjs
      - name: Hints that fit — a teacher's quoted hint is shown, the fallback fits and points to Ask, a DOL offers neither
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/hintsThatFit.mjs
      - name: Work View Help reaches the steps, the hints and Ask on a phone; a DOL shows no hint and no method
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/workViewHelpReach.mjs
      - name: Relation plots are graded by their points
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/relationPlotGrading.mjs
      - name: A phone stays a phone after a full-page screenshot
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/touchAfterScreenshot.mjs

  # The student-runtime gates, continued (see the header).
  student-runtime-2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the harness server
        run: |
          npx vite --host 127.0.0.1 --port 5199 --strictPort >/tmp/student-runtime-vite.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:5199/tests/browser/renderStability.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/student-runtime-vite.log; exit 1
      - name: A tool's attempt outcome is shown beside its verdict
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/toolAttemptOutcome.mjs
      - name: Nothing before Submit reveals correctness on a DOL, quiz or test
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/assessmentLeakGates.mjs
      - name: An assignment's calculator setting reaches the student (graphing calculator)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/assignmentGraphingCalculator.mjs
      - name: The inequality workspace takes a student through every step without hunting
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/systemsWorkspaceStudio.mjs
      - name: Taps land where they are made on a letterboxed plane
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/clickMapLetterbox.mjs
      - name: Every step of a staged question fits and leaks nothing, on six screens
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/stagedQuestion.mjs

  # The student-runtime gates, continued (see the header).
  student-runtime-3:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the harness server
        run: |
          npx vite --host 127.0.0.1 --port 5199 --strictPort >/tmp/student-runtime-vite.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:5199/tests/browser/renderStability.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/student-runtime-vite.log; exit 1
      - name: A judgment the student is asked to make starts unanswered and earns nothing unanswered
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/unansweredChoiceGates.mjs
      - name: Graph analysis fields are named, and the keyboard route offers only what is there
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/graphKeyboardRoute.mjs
      - name: On a phone, plane text is readable and a missed drag keeps the line
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/planePhoneReach.mjs
      - name: Self-disabling tool controls keep keyboard focus
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/focusSafeToolControls.mjs
      - name: A composed question with a graph step survives a Chromebook swap
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/composedDraftRestore.mjs
      - name: Opening a question is not an edit, in every certified family
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/draftEditTime.mjs
      - name: A fraction key drawn from a template is graded by one rule
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/fractionTemplateGrading.mjs
      - name: A closed question stays closed after its module fails
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/moduleRecoveryLock.mjs
      - name: Enter on a closed question goes on only from the page
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/closedQuestionEnter.mjs
      - name: Figures say what they show, from the accessibility tree
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/figureDescriptions.mjs
      - name: Each math keypad is one Tab stop
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/mathKeypadToolbar.mjs
      - name: Information you need stays reachable in Work View
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/workViewReference.mjs
      - name: A production build serves the math fonts
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/mathFontsProduction.mjs

  # Student pass 3's drivers on the plain dev server, in two jobs of about seven
  # minutes (one runner took 14 minutes for them all).
  pass3-student-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the harness server
        run: |
          npx vite --host 127.0.0.1 --port 5199 --strictPort >/tmp/pass3-student-vite.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:5199/tests/browser/toolOpenAudit.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/pass3-student-vite.log; exit 1
      - name: A submission the device could not queue is not submitted (RUN-3)
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/submitNotQueued.mjs
      - name: Every draft-backed tool saves and restores its draft
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/toolDraftSyncSweep.mjs
      - name: Matrix Lab feedback, and the Work View rail's Submit on a DOL
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/matrixLabFeedback.mjs
      - name: The Day 1 3×3 lesson, solved the way a student solves it (#361)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/day1SystemsJourney.mjs
      - name: "Day 2 non-unique 3×3 systems (#390, #392)"
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/day2NonuniqueJourneys.mjs

  # Student pass 3's drivers, continued (see pass3-student-screens).
  pass3-student-screens-2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Start the harness server
        run: |
          npx vite --host 127.0.0.1 --port 5199 --strictPort >/tmp/pass3-student-vite.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:5199/tests/browser/toolOpenAudit.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/pass3-student-vite.log; exit 1
      - name: After the last miss, through the real QuestionEngine (Batch 4)
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/afterLastMiss.mjs
      - name: Composed questions on a phone
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/assignmentMobile.mjs
      - name: Home — one primary action, honest cards, the right question
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/studentHomeToday.mjs
      - name: Grades — Start on open work, ways to raise it, how it is figured
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/studentGradesRaise.mjs
      - name: The Assignments Center and the result follow the one "Today" rule
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/studentResultUpNext.mjs
      - name: What changed since the last visit, and the one Log Out
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/studentWhatChanged.mjs
      - name: The Grade Center and the result on a 390px phone
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/gradeCenterMobile.mjs
      - name: A Step Algebra step the device could not queue is not submitted
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/stepNotQueued.mjs
      - name: A tool's outcome box can be reached on every screen
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/toolOutcomeReach.mjs
      - name: Feedback reasons, part 2
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/feedbackReasons2.mjs
      - name: Tool choices are radio groups
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5199"
        run: node tests/browser/toolChoiceGroups.mjs

  # The secure screens (results, navigation, access parity) against stubbed
  # services. secureResults and secureExamNavigation start their own Vite;
  # secureAccessParity uses the emulator config's stubs. About 10 minutes.
  pass3-secure-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - name: Released results, for the student and the teacher
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/secureResults.mjs
      - name: Moving through a secure test
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/browser/secureExamNavigation.mjs
      - name: Start the stubbed harness server
        if: ${{ !cancelled() }}
        run: |
          npx vite --config tests/browser/emulator/vite.config.mjs --host 127.0.0.1 --port 5203 --strictPort >/tmp/pass3-secure-vite.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:5203/tests/browser/secureAccessParity.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/pass3-secure-vite.log; exit 1
      - name: Secure items give every student the same access
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5203"
        run: node tests/browser/secureAccessParity.mjs
