name: Apply persistent task context patch

on:
  push:
    branches:
      - fix/persistent-task-context-and-legacy-graph
    paths:
      - .github/workflows/apply-persistent-task-context-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/persistent-task-context-and-legacy-graph
          fetch-depth: 0
      - name: Apply Codex patch and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .codex-patches/persistent-task-context.diff.gz.b64 | gunzip > /tmp/codex.patch
          echo '0c5acf2c3f3aa9c01f9017790fc025cb2e71a18d1647deb66eb480ebe4b866b1  /tmp/codex.patch' | sha256sum -c -
          git apply --check /tmp/codex.patch
          git apply /tmp/codex.patch
          git rm .codex-patches/persistent-task-context.diff.gz.b64
          git rm .github/workflows/apply-persistent-task-context-patch.yml
          git config user.name 'MathMaster Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix persistent task context and legacy synthetic graphs'
          git push origin HEAD:fix/persistent-task-context-and-legacy-graph
