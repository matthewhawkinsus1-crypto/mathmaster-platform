name: Diagnose PR263 integration conflicts

on:
  push:
    branches:
      - claude/nifty-shannon-t9a7s3
    paths:
      - .github/workflows/pr263-integration-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose merge with main
        shell: bash
        run: |
          set -u
          git fetch origin main
          git config user.name 'ChatGPT PR263 Integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          echo "merge_exit=$rc"
          echo '--- conflicted paths ---'
          git diff --name-only --diff-filter=U || true
          echo '--- status ---'
          git status --short
          echo '--- conflict marker context ---'
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            echo "===== $file ====="
            grep -n -B 12 -A 20 -E '^(<<<<<<<|=======|>>>>>>>)' "$file" || true
          done < <(git diff --name-only --diff-filter=U)
          git merge --abort >/dev/null 2>&1 || true
          exit 0
