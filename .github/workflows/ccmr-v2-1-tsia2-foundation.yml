name: TSIA2 V2.1 Foundation

on:
  push:
    branches:
      - ccmr-fidelity-v2-1-authentic-language
    paths:
      - 'src/platform/assessment/examDomainRegistry.js'
      - 'src/platform/ccmr/assessmentProfiles.js'
      - 'src/platform/policies/calculatorPolicy.js'
      - 'src/platform/policies/calculatorExpression.js'
      - 'src/platform/policies/examPolicyResolver.js'
      - 'src/components/CalculatorPanel.jsx'
      - 'tests/platform/tsia2Weighting.test.mjs'
      - 'tests/platform/tsia2CalculatorMode.test.mjs'
      - '.github/workflows/ccmr-v2-1-tsia2-foundation.yml'
  workflow_dispatch:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run TSIA2 foundation regression tests
        run: node --test tests/platform/tsia2Weighting.test.mjs tests/platform/tsia2CalculatorMode.test.mjs
      - name: Build application
        run: npm run build
