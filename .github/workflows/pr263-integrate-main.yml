name: Integrate main into PR263 safely

on:
  push:
    branches:
      - claude/nifty-shannon-t9a7s3
    paths:
      - .github/workflows/pr263-integrate-main.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Merge main and resolve the three verified conflicts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'ChatGPT PR263 Integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e

          if [ "$merge_rc" -ne 0 ]; then
            mapfile -t conflicted < <(git diff --name-only --diff-filter=U)
            printf 'Conflicted paths:\n%s\n' "${conflicted[*]}"
            expected=(
              'src/TeacherSidebar.jsx'
              'tests/platform/practicePassAppRuntimeWiring.test.mjs'
              'tests/platform/practicePassClientEligibility.test.mjs'
            )
            if [ "${#conflicted[@]}" -ne "${#expected[@]}" ]; then
              echo 'Unexpected conflict count; refusing automatic resolution.' >&2
              exit 1
            fi
            for path in "${expected[@]}"; do
              printf '%s\n' "${conflicted[@]}" | grep -Fxq "$path" || {
                echo "Expected conflict missing or unexpected conflict present: $path" >&2
                exit 1
              }
            done
          fi

          python - <<'PY'
          from pathlib import Path

          replacements = {
              'src/TeacherSidebar.jsx': (
                  "<<<<<<< HEAD\n  { id: 'people', label: 'Classes', tabs: ['classesWorkspace', 'students', 'attendanceHistory', 'weeklyPath', 'pacing'] },\n  { id: 'insight', label: 'Evidence', tabs: ['grades', 'standards', 'analytics', 'exams'] },\n=======\n  { id: 'people', label: 'Classes', tabs: ['classesWorkspace', 'students', 'weeklyPath', 'pacing'] },\n  { id: 'insight', label: 'Evidence', tabs: ['grades', 'gradeTransfer', 'standards', 'analytics', 'exams'] },\n>>>>>>> origin/main",
                  "  { id: 'people', label: 'Classes', tabs: ['classesWorkspace', 'students', 'attendanceHistory', 'weeklyPath', 'pacing'] },\n  { id: 'insight', label: 'Evidence', tabs: ['grades', 'gradeTransfer', 'standards', 'analytics', 'exams'] },",
              ),
              'tests/platform/practicePassAppRuntimeWiring.test.mjs': (
                  "<<<<<<< HEAD\n    '// A question change should feel like changing pages',\n=======\n    '  ]);\\n\\n  // A question change should feel like changing pages',\n>>>>>>> origin/main",
                  "    '  ]);\\n\\n  // A question change should feel like changing pages',",
              ),
              'tests/platform/practicePassClientEligibility.test.mjs': (
                  "<<<<<<< HEAD\n    nowValue: Date.parse('2026-09-01T00:00:00.000Z'),\n=======\n    // Keep this ordering contract independent of the wall clock. The fixture\n    // represents two open assignments, not an assignment that becomes stale\n    // when the calendar reaches its hard-coded late deadline.\n    nowValue: Date.parse('2026-09-09T12:00:00.000Z'),\n>>>>>>> origin/main",
                  "    // Keep this ordering contract independent of the wall clock. The fixture\n    // represents two open assignments, not an assignment that becomes stale\n    // when the calendar reaches its hard-coded late deadline.\n    nowValue: Date.parse('2026-09-09T12:00:00.000Z'),",
              ),
          }

          for path, (old, new) in replacements.items():
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected verified conflict block not found in {path}; refusing unsafe merge')
              p.write_text(text.replace(old, new, 1))
          PY

          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- src/TeacherSidebar.jsx tests/platform/practicePassAppRuntimeWiring.test.mjs tests/platform/practicePassClientEligibility.test.mjs; then
            echo 'Conflict markers remain; refusing merge.' >&2
            exit 1
          fi

          grep -Fq "'attendanceHistory'" src/TeacherSidebar.jsx
          grep -Fq "'gradeTransfer'" src/TeacherSidebar.jsx
          test -f src/components/teacher/GradeTransferCenter.jsx
          test -f src/platform/attendance/attendanceHistory.js

          git add -A
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo 'Unmerged paths remain.' >&2
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git diff --cached --check

      - name: Install dependencies
        run: npm ci
      - name: Verify integrated Grade Transfer and attendance behavior
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/platform/gradeTransfer*.test.mjs
          node --test tests/platform/attendance*.test.mjs
          node --test tests/platform/practicePassAppRuntimeWiring.test.mjs tests/platform/practicePassClientEligibility.test.mjs
          npm run build:firebase
      - name: Commit and push verified merge
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/pr263-integration-diagnostic.yml .github/workflows/pr263-fix-launcher.yml .github/workflows/pr263-integrate-main.yml
          git add -A
          git commit -m 'merge: integrate Grade Transfer main into attendance extensions'
          git push origin HEAD:claude/nifty-shannon-t9a7s3
