name: PR263 integrate Grade Transfer main

on:
  push:
    branches:
      - claude/nifty-shannon-t9a7s3
    paths:
      - .github/workflows/pr263-integrate-main.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'merge: integrate PR263 with Grade Transfer main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Merge current main and preserve both features
        shell: bash
        run: |
          git config user.name 'ChatGPT PR263 Integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$conflicts" ]; then
            echo "Merge conflicts:"
            echo "$conflicts"
            python3 - <<'PY'
          import subprocess
          expected = {
              'firestore.indexes.json',
              'firestore.rules',
              'src/App.jsx',
              'src/TeacherSidebar.jsx',
              'tests/firestore-rules.test.mjs',
          }
          actual = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=U'], text=True
          ).splitlines()))
          unexpected = actual - expected
          if unexpected:
              raise SystemExit(f'Unexpected merge conflicts: {sorted(unexpected)}')
          for path in sorted(actual):
              subprocess.run(['git', 'checkout', '--ours', '--', path], check=True)
          PY
          fi

          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          def main_text(path):
              return subprocess.check_output(['git', 'show', f'origin/main:{path}'], text=True)

          def insert_after_once(text, anchor, addition, label):
              if addition.strip() in text:
                  return text
              if text.count(anchor) != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {text.count(anchor)}')
              return text.replace(anchor, anchor + addition, 1)

          # App.jsx: start from PR263's attendance-aware runtime and layer in
          # the already-merged Grade Transfer additions from main.
          app_path = Path('src/App.jsx')
          app = app_path.read_text()
          canonical_import = "\nimport { projectTeacherOverridesForDisplay } from './platform/grading/canonicalGradeProjection.js';"
          grade_evidence_import = "import { COMPARABILITY, describeDeliveredRigor, explainGrade, rigorComparability, splitGrade, splitGradesBySection } from './platform/teacher/gradeEvidence.js';"
          app = insert_after_once(app, grade_evidence_import, canonical_import, 'App canonical projection import')

          override_marker = '/*\n * TEACHER OVERRIDES ARE A PRESENTATION LAYER OVER THE AUTOMATIC ATTEMPT.'
          if override_marker in app:
              start = app.index(override_marker)
              end = app.index('function App() {', start)
              app = app[:start] + app[end:]

          lazy_anchor = "const TeacherSidebar = lazy(() => import('./TeacherSidebar.jsx'));"
          lazy_line = "\nconst GradeTransferCenter = lazy(() => import('./components/teacher/GradeTransferCenter.jsx'));"
          app = insert_after_once(app, lazy_anchor, lazy_line, 'App GradeTransfer lazy import')

          old_refresh = "if (['students', 'grades', 'standards', 'analytics', 'exams'].includes(tab))"
          new_refresh = "if (['students', 'grades', 'gradeTransfer', 'standards', 'analytics', 'exams'].includes(tab))"
          if old_refresh in app:
              app = app.replace(old_refresh, new_refresh, 1)
          elif new_refresh not in app:
              raise SystemExit('App teacher-tab refresh anchor not found')

          if "teacherTab === 'gradeTransfer'" not in app:
              main_app = main_text('src/App.jsx')
              block_start = main_app.index("            {teacherTab === 'gradeTransfer' && (")
              block_end = main_app.index("\n\n\n            {responseInspectorTarget && (", block_start)
              grade_transfer_block = main_app[block_start:block_end]
              render_anchor = "            {responseInspectorTarget && ("
              if app.count(render_anchor) != 1:
                  raise SystemExit('App Grade Transfer render anchor not unique')
              app = app.replace(render_anchor, grade_transfer_block + "\n\n\n" + render_anchor, 1)
          app_path.write_text(app)

          # Sidebar: preserve Attendance History under Classes and Grade Transfer
          # under Evidence.
          sidebar_path = Path('src/TeacherSidebar.jsx')
          sidebar = sidebar_path.read_text()
          if "gradeTransfer: 'Grade Transfer'" not in sidebar:
              sidebar = sidebar.replace("  grades: 'Grades',\n", "  grades: 'Grades',\n  gradeTransfer: 'Grade Transfer',\n", 1)
          if "gradeTransfer: '📤'" not in sidebar:
              sidebar = sidebar.replace("  grades: '📊',\n", "  grades: '📊',\n  gradeTransfer: '📤',\n", 1)
          old_evidence = "{ id: 'insight', label: 'Evidence', tabs: ['grades', 'standards', 'analytics', 'exams'] }"
          new_evidence = "{ id: 'insight', label: 'Evidence', tabs: ['grades', 'gradeTransfer', 'standards', 'analytics', 'exams'] }"
          if old_evidence in sidebar:
              sidebar = sidebar.replace(old_evidence, new_evidence, 1)
          elif new_evidence not in sidebar:
              raise SystemExit('Sidebar Evidence group anchor not found')
          sidebar_path.write_text(sidebar)

          # Firestore indexes: retain Attendance History's scoped query and add
          # the Grade Transfer snapshot query from main.
          index_path = Path('firestore.indexes.json')
          index_doc = json.loads(index_path.read_text())
          if not any(entry.get('collectionGroup') == 'gradeTransferSnapshots' for entry in index_doc.get('indexes', [])):
              main_indexes = json.loads(main_text('firestore.indexes.json'))
              grade_index = next(entry for entry in main_indexes['indexes'] if entry.get('collectionGroup') == 'gradeTransferSnapshots')
              index_doc['indexes'].insert(0, grade_index)
          index_path.write_text(json.dumps(index_doc, indent=2) + '\n')

          # Firestore rules: retain callable-only studentOverrides protection and
          # add Grade Transfer immutable-snapshot rules exactly as merged on main.
          rules_path = Path('firestore.rules')
          rules = rules_path.read_text()
          if 'match /gradeTransferSnapshots/{transferId}' not in rules:
              main_rules = main_text('firestore.rules')
              start = main_rules.index('    /*\n     * Immutable SIS transfer evidence.')
              end = main_rules.index('    // Authentication internals', start)
              block = main_rules[start:end]
              anchor = '    // Authentication internals'
              if rules.count(anchor) != 1:
                  raise SystemExit('Firestore Grade Transfer insertion anchor not unique')
              rules = rules.replace(anchor, block + anchor, 1)
          rules_path.write_text(rules)

          # Rules tests: preserve PR263 studentOverrides tests and add the exact
          # Grade Transfer security regression block from main.
          test_path = Path('tests/firestore-rules.test.mjs')
          tests = test_path.read_text()
          main_tests = main_text('tests/firestore-rules.test.mjs')
          if "classes/class-1" not in tests:
              setup_anchor = "  await setDoc(doc(db, 'assignments/A1'), { title: 'Unit 1' });\n"
              setup_add = (
                  "  await setDoc(doc(db, 'classes/class-1'), { teacherOfRecord: TEACHER_EMAIL, period: 'Period 1' });\n"
                  "  await setDoc(doc(db, 'classes/class-2'), { teacherOfRecord: OTHER_TEACHER_EMAIL, period: 'Period 2' });\n"
              )
              if tests.count(setup_anchor) != 1:
                  raise SystemExit('Rules class setup anchor not unique')
              tests = tests.replace(setup_anchor, setup_anchor + setup_add, 1)
          if '// --- Grade Transfer snapshots' not in tests:
              start = main_tests.index('// --- Grade Transfer snapshots')
              end = main_tests.index("await check('teacher reads authorized scratchpad'", start)
              block = main_tests[start:end]
              anchor = "await check('teacher reads authorized scratchpad'"
              if tests.count(anchor) != 1:
                  raise SystemExit('Rules Grade Transfer test anchor not unique')
              tests = tests.replace(anchor, block + anchor, 1)
          test_path.write_text(tests)
          PY

          git add firestore.indexes.json firestore.rules src/App.jsx src/TeacherSidebar.jsx tests/firestore-rules.test.mjs
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved conflicts remain:'
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git diff --check

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Write regression tests first
        shell: bash
        run: |
          cat > tests/platform/pr263AttendanceHardening.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { DEFAULT_CLASS_SCHEDULE, normalizeSchedule } from '../../src/assignmentLifecycle.js';
          import { ATTENDANCE_MARK } from '../../src/platform/attendance/absencePolicy.js';
          import { resolveStudentExtension } from '../../src/platform/attendance/extensionReconciliation.js';

          const period = (enabled) => ({ enabled, start: '09:00', end: '09:50' });
          const schedule = normalizeSchedule({
            ...DEFAULT_CLASS_SCHEDULE,
            daySchedules: {
              A: { periods: { 'Period 3': period(true) } },
              B: { periods: { 'Period 3': period(false) } },
            },
          });

          test('removing the last absence requires explicit review before an existing extension is shortened', () => {
            const assignment = {
              id: 'a1', releaseAt: '2026-08-24T00:00:00.000Z', dueAt: '2026-08-31T23:59:00.000Z',
              lateDueAt: '2026-09-04T23:59:00.000Z',
              studentOverrides: { s1: { extension: { dateKey: '2026-09-09', meetingsGranted: 1 }, lateDueAt: '2026-09-09T23:59:00.000Z' } },
            };
            const result = resolveStudentExtension({ assignment, studentId: 's1', marks: [], schedule, classPeriod: 'Period 3', nonInstructionalKeys: new Set() });
            assert.equal(result.reviewNeeded, true);
            assert.equal(result.reason, 'would_shorten_existing_extension');
            assert.equal(result.extensionMeetings, 0);
            assert.equal(result.proposed.dateKey, '2026-09-04');
          });

          test('an unclassified live absence remains in the extension audit source dates', () => {
            const assignment = { id: 'a2', releaseAt: '2026-08-24T00:00:00.000Z', dueAt: '2026-08-31T23:59:00.000Z' };
            const result = resolveStudentExtension({
              assignment, studentId: 's1',
              marks: [{ dateKey: '2026-08-31', mark: ATTENDANCE_MARK.ABSENT_UNCLASSIFIED, classMet: true }],
              schedule, classPeriod: 'Period 3', nonInstructionalKeys: new Set(),
            });
            assert.equal(result.changed, true);
            assert.deepEqual(result.proposed.sourceAbsenceDates, ['2026-08-31']);
          });

          test('reconciliation reads scoped attendance history and persists a retry marker on partial failure', () => {
            const store = readFileSync(new URL('../../src/platform/teacher/studentSupportStore.js', import.meta.url), 'utf8');
            const app = readFileSync(new URL('../../src/App.jsx', import.meta.url), 'utf8');
            assert.match(store, /export const fetchAttendanceForClassRange/);
            assert.match(store, /where\('dateKey', '>=', from\)/);
            assert.match(store, /where\('dateKey', '<=', to\)/);
            assert.match(app, /fetchAttendanceForClassRange/);
            assert.match(app, /attendanceExtensionReconciliationPending/);
            assert.match(app, /attendanceExtensionReconciliationResolved/);
            assert.doesNotMatch(app, /supportEvents: \[\.\.\.studentSupportEvents, record\]/);
          });

          test('explicit shortening cannot bypass malformed-cutoff validation', () => {
            const source = readFileSync(new URL('../../functions/index.js', import.meta.url), 'utf8');
            assert.match(source, /allowShorten && validity\.reason === "failed-precondition"/);
          });

          test('combined teacher runtime retains both Attendance History and Grade Transfer', () => {
            const app = readFileSync(new URL('../../src/App.jsx', import.meta.url), 'utf8');
            const sidebar = readFileSync(new URL('../../src/TeacherSidebar.jsx', import.meta.url), 'utf8');
            assert.match(app, /AttendanceHistoryPanel/);
            assert.match(app, /GradeTransferCenter/);
            assert.match(sidebar, /attendanceHistory/);
            assert.match(sidebar, /gradeTransfer/);
          });
          EOF

      - name: Verify regression tests are RED before the missing fixes
        shell: bash
        run: |
          set +e
          node --test tests/platform/pr263AttendanceHardening.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected the new regression suite to fail before the missing fixes, but it passed.'
            exit 1
          fi
          echo 'RED confirmed: the new tests detect the unfinished PR263 behavior.'

      - name: Apply the missing attendance hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          # One small fix from the old hardening plan belongs to section 4 but
          # was not included in the cutoff-only Codex commit that did land.
          functions_path = Path('functions/index.js')
          functions = functions_path.read_text()
          old = '    if (!validity.valid && !allowShorten) throw new HttpsError(validity.reason, validity.message);'
          new = '''    if (!validity.valid && !(allowShorten && validity.reason === "failed-precondition")) {
              throw new HttpsError(validity.reason, validity.message);
            }'''
          if old in functions:
              functions = functions.replace(old, new, 1)
          elif 'allowShorten && validity.reason === "failed-precondition"' not in functions:
              raise SystemExit('Could not locate allowShorten validation guard')
          functions_path.write_text(functions)

          # Reuse the already-reviewed missing sections 5-7 from the prior
          # PR263 hardening helper in git history. Sections 1-4 were the cutoff
          # fix that is already present on this head; section 8 only wrote tests.
          old_workflow = subprocess.check_output([
              'git', 'show', 'ba172e651223e26ae7d2b303399f7e0f70bfab90:.github/workflows/pr263-finish.yml'
          ], text=True)
          block = old_workflow.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          start = block.index('          # 5)')
          end = block.index('          # 8)')
          fragment = textwrap.dedent(block[start:end])
          preamble = '''from pathlib import Path\n\ndef replace_once(path, old, new):\n    p = Path(path)\n    text = p.read_text()\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{path}: expected exactly one replacement, found {count}")\n    p.write_text(text.replace(old, new, 1))\n\n'''
          exec(compile(preamble + fragment, '<pr263-hardening>', 'exec'), {})
          PY
          git diff --check

      - name: Verify focused Grade Transfer and attendance regressions are GREEN
        shell: bash
        run: |
          node --test \
            tests/platform/gradeTransfer.test.mjs \
            tests/platform/gradeTransferCompletion.test.mjs \
            tests/platform/attendanceCorrectionReviewWorkflow.test.mjs \
            tests/platform/attendanceExtensionAuthorization.test.mjs \
            tests/platform/attendanceExtensionReconciliation.test.mjs \
            tests/platform/attendanceExtensionRuntimeParity.test.mjs \
            tests/platform/attendanceExtensionServerParity.test.mjs \
            tests/platform/attendanceHistory.test.mjs \
            tests/platform/attendanceHistoryAuthorization.test.mjs \
            tests/platform/attendanceHistoryPanelNames.test.mjs \
            tests/platform/attendanceHistoryScopedQuery.test.mjs \
            tests/platform/attendanceReconciliationUnifiedPath.test.mjs \
            tests/platform/attendanceReturnCheckIn.test.mjs \
            tests/platform/attendanceUnclassifiedAbsence.test.mjs \
            tests/platform/pr263AttendanceHardening.test.mjs

      - name: Run platform and authoring gates
        run: |
          npm run test:platform
          npm run test:authoring-v5

      - name: Compare Firestore rules failures with current main
        shell: bash
        run: |
          set +e
          npm run test:rules 2>&1 | tee /tmp/pr263-rules.log
          branch_status=${PIPESTATUS[0]}
          set -e

          git worktree add --detach /tmp/main-check origin/main
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/main-check/node_modules
          if [ -d "$GITHUB_WORKSPACE/functions/node_modules" ]; then
            ln -s "$GITHUB_WORKSPACE/functions/node_modules" /tmp/main-check/functions/node_modules
          fi
          set +e
          (cd /tmp/main-check && npm run test:rules) 2>&1 | tee /tmp/main-rules.log
          main_status=${PIPESTATUS[0]}
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re
          def failures(path):
              lines = Path(path).read_text(errors='replace').splitlines()
              keep = []
              for line in lines:
                  clean = re.sub(r'\x1b\[[0-9;]*m', '', line).strip()
                  if re.search(r'(^not ok\b|FAIL|failed|AssertionError)', clean, re.I):
                      keep.append(clean)
              return keep
          main = failures('/tmp/main-rules.log')
          branch = failures('/tmp/pr263-rules.log')
          print('Main rule failure signatures:', main)
          print('PR263 rule failure signatures:', branch)
          if branch != main:
              raise SystemExit('PR263 Firestore-rule failures differ from current main; refusing to push.')
          PY
          if [ "$branch_status" -eq 0 ] && [ "$main_status" -ne 0 ]; then
            echo 'PR263 improves the rule suite versus main.'
          elif [ "$branch_status" -ne 0 ] && [ "$main_status" -eq 0 ]; then
            echo 'PR263 introduced a rule-suite regression.'
            exit 1
          fi

      - name: Build and lint
        run: |
          npm run build
          npm run build:firebase
          npm run lint
          git diff --check

      - name: Commit verified integration and remove helper
        shell: bash
        run: |
          git rm .github/workflows/pr263-integrate-main.yml
          git add -A
          git status --short
          git commit -m 'merge: integrate PR263 with Grade Transfer main'
          git push origin HEAD:claude/nifty-shannon-t9a7s3
