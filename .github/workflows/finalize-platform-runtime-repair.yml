name: Finalize platform runtime repair

on:
  push:
    branches:
      - codex/platform-question-runtime-repair
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.ref == 'refs/heads/codex/platform-question-runtime-repair'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/platform-question-runtime-repair
          fetch-depth: 0

      - name: Apply exact final transforms
        run: node scripts/finalize-platform-runtime-repair.mjs

      - name: Run focused regressions
        run: node --test tests/platform/workflowPresentationRuntime.test.mjs tests/platform/questionGenerationContainment.test.mjs tests/platform/pathQuestionGenerationDependency.test.mjs

      - name: Remove one-time finalizer
        run: |
          rm scripts/finalize-platform-runtime-repair.mjs
          rm .github/workflows/finalize-platform-runtime-repair.yml

      - name: Commit final platform repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/workflow/WorkflowRunner.jsx tests/platform/workflowPresentationRuntime.test.mjs scripts/finalize-platform-runtime-repair.mjs .github/workflows/finalize-platform-runtime-repair.yml
          git diff --cached --check
          git commit -m "fix: keep one authoritative workflow evidence graph"
          git push origin HEAD:codex/platform-question-runtime-repair
