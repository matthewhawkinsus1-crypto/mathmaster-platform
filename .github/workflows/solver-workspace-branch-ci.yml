name: Solver Workspace Branch Verification

on:
  push:
    branches:
      - spec/solver-workspace-undo-integrity

permissions:
  contents: write

concurrency:
  group: solver-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Apply reviewed branch edit when present
        id: edit
        shell: bash
        run: |
          if [[ -f .github/solver-workspace-edit.mjs ]]; then
            message="$(cat .github/solver-workspace-commit-message.txt 2>/dev/null || echo 'chore: apply solver workspace edit')"
            echo "message=$message" >> "$GITHUB_OUTPUT"
            node .github/solver-workspace-edit.mjs
            rm -f .github/solver-workspace-edit.mjs .github/solver-workspace-commit-message.txt
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run focused solver tests
        shell: bash
        run: |
          tests=(tests/platform/solverWorkspaceModes.test.mjs)
          for f in \
            tests/platform/algebraAstIntegrity.test.mjs \
            tests/platform/algebraRelationIntegrity.test.mjs \
            tests/platform/solverUndoHistory.test.mjs \
            tests/platform/solverStepCreditReplay.test.mjs
          do
            [[ -f "$f" ]] && tests+=("$f")
          done
          node --test "${tests[@]}"

      - name: Run complete platform test suite
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=4 tests/platform/*.test.mjs > /tmp/platform-tests.log 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            echo "Full platform suite failed. Printing only failure neighborhoods."
            mapfile -t failed_lines < <(grep -n "not ok " /tmp/platform-tests.log | cut -d: -f1 || true)
            if [[ ${#failed_lines[@]} -eq 0 ]]; then
              tail -n 160 /tmp/platform-tests.log
            else
              for line in "${failed_lines[@]}"; do
                start=$(( line > 8 ? line - 8 : 1 ))
                end=$(( line + 55 ))
                echo "----- failure near line $line -----"
                sed -n "${start},${end}p" /tmp/platform-tests.log
              done
              echo "----- suite totals -----"
              grep -E '^# (tests|pass|fail|cancelled|skipped|todo|duration_ms)' /tmp/platform-tests.log | tail -n 12 || true
            fi
          fi
          exit $status

      - name: Run lint
        run: npm run lint

      - name: Audit solver integrity contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "magnitude: term.magnitudeText" src/algebraAstEngine.js
          if grep -nE "magnitude: String\(term\.text\).*replace|String\(term\.text\).*replace.*magnitude" src/algebraAstEngine.js; then
            echo "Found sign reconstruction from term.text in additive placement" >&2
            exit 1
          fi
          grep -q "onWorkspaceModeChange" src/components/common/SolverWorkspaceFrame.jsx
          grep -q "workspaceActions" src/components/common/SolverWorkspaceFrame.jsx
          grep -q "multi-relation-branches--dense" src/MultiRelationAlgebraCore.jsx
          grep -q "multi-relation-split-editor--dense" src/MultiRelationAlgebraCore.jsx
          grep -q "mathmaster-desktop-action-bar" src/components/student/MobileViewportContainer.jsx
          echo "Solver source audit passed."

      - name: Build production web
        run: npm run build

      - name: Commit verified edit back to the feature branch
        if: steps.edit.outputs.applied == 'true'
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Edit script made no changes."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "${{ steps.edit.outputs.message }}"
          git push origin HEAD:spec/solver-workspace-undo-integrity
