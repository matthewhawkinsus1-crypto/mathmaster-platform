name: Work View Browser Matrix

# RENDERED SCREENSHOTS ARE PART OF THE DECISION NOW.
#
# The Stage 3A families are judged on what a student actually sees: whether the
# controls a tool registered are on screen and pressable, whether anything sits
# on the workspace, whether the mathematics survives entering and leaving Work
# View. None of that can be read off the source, and the local bench does not
# always have a browser — so this job installs one, drives the real
# QuestionEngine on a Chromebook and an iPhone in both orientations, and uploads
# every capture for review.
#
# The committed findings fixture is what the ordinary suite asserts is empty
# (tests/platform/workViewMatrixFindings.test.mjs). This job fails when the live
# browser disagrees with it, which is the point: the fixture must never drift
# ahead of what the browser does.
#
# Beside it, work-view-opener-cover (tests/browser/workViewOpenerCover.mjs):
# nothing a student needs under "Open Work View" on any surface it floats over
# (every registry tool, Path tool and legacy question type in the assignment
# screen, the figures that are their own Work View in My Math Path and a secure
# Test, the Math Tools Lab, the colour-alone page's figures on their own), on
# three phones at 100% and 200% text and a Chromebook; the assignment screen's
# tries and completion badges clear of the opener and of each other (#386 R17);
# and with Work View open, the view the one thing that scrolls up and down
# (#386 R10).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  work-view-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install application dependencies and Chromium
        uses: ./.github/actions/setup
        with: { browser: "true" }

      - name: Certify Test Cycle Chromebook and phone
        env:
          PLAYWRIGHT_MODULE: playwright
        run: npm run test:test-cycle-device

      - name: Certify unfinished work persistence
        env:
          PLAYWRIGHT_MODULE: playwright
        run: npm run test:draft-persistence

      - name: Certify durable 30-student action load
        run: npm run certify:performance:load

      - name: Start the harness app
        run: |
          npx vite --host 127.0.0.1 --port 5199 --strictPort > /tmp/mathmaster-vite.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5199/tests/browser/workViewMatrix.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mathmaster-vite.log
          exit 1

      - name: Certify IndexedDB reload recovery
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: http://127.0.0.1:5199
        run: node tests/browser/durableOutboxRecovery.mjs

      - name: Drive the Work View matrix and capture screenshots
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: http://127.0.0.1:5199
        run: node tests/browser/workViewMatrix.mjs --write

      # Uploaded whether or not the run passed: a failure is exactly when
      # somebody wants to look at the picture.
      - name: Publish the rendered matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-view-matrix-screenshots
          path: tests/browser/artifacts/workView
          if-no-files-found: error
          retention-days: 14

      - name: Show findings drift
        if: ${{ !cancelled() }}
        run: git diff -- tests/platform/fixtures/workViewMatrixFindings.json || true

      - name: Require the committed findings to match the real browser
        run: |
          node -e "
            const audit = require('./tests/platform/fixtures/workViewMatrixFindings.json');
            if (audit.findings.length) {
              console.error(JSON.stringify(audit.findings, null, 2));
              process.exit(1);
            }
          "

      - name: Re-assert the fixture through the ordinary suite
        run: node --test tests/platform/workViewMatrixFindings.test.mjs tests/platform/workViewStage3A.test.mjs tests/platform/workViewStage3B.test.mjs tests/platform/workViewCapabilities.test.mjs

      # Issue #334: isolate x with Step Algebra's own controls, drop the token
      # the platform builds onto x in Equation 2, and require the embedded
      # one-variable solve to open — fresh, from a draft saved on the broken
      # build, after leaving and returning, in Student View and Teacher Preview.
      - name: Certify the Classwork Q2 substitution handoff
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: http://127.0.0.1:5199
        run: node tests/browser/algebraicSubstitutionHandoff.mjs

      - name: Publish the substitution handoff screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algebraic-substitution-handoff
          path: tests/browser/artifacts/algebraicSubstitutionHandoff
          if-no-files-found: ignore
          retention-days: 14

  # What Work View's opener covers, the header's badges, one scroller in Work View, every staged step's room and a hint
  # asked for on it (see the header). The stubbed harness serves the assignment harness, the hosts' page and the
  # colour-alone page (its own dependency cache: forcedColors.vite.config.mjs); the in-memory app serves the Math Tools
  # Lab and the assignment screen. 58 readings: about 23 minutes here, three at a time (the 52 before the hint check
  # took 18.1 minutes on 2026-11-18, and each of its six readings presses "Show a hint" on 23 steps, about two minutes);
  # 36 minutes on a shared four-core machine at a load of 15 to 27, two at a time.
  work-view-opener-cover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install application dependencies and Chromium
        uses: ./.github/actions/setup
        with: { browser: "true" }

      - name: Start the stubbed harness server
        run: |
          npx vite --config tests/browser/forcedColors.vite.config.mjs --host 127.0.0.1 --port 5198 --strictPort >/tmp/opener-cover-vite.log 2>&1 &
          for i in {1..90}; do curl -fsS http://127.0.0.1:5198/tests/browser/studentUxPlatform.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/opener-cover-vite.log; exit 1

      - name: Start the in-memory app harness
        run: |
          npx vite --config tests/browser/teacherWorkflow/vite.config.mjs >/tmp/opener-cover-teacher.log 2>&1 &
          for i in {1..120}; do curl -fsS http://127.0.0.1:5188/tests/browser/teacherWorkflow/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/opener-cover-teacher.log; exit 1

      - name: Nothing a student needs under Work View's opener; tries and completion badges clear; one scroller in Work View; every staged step has room
        env:
          PLAYWRIGHT_MODULE: playwright
          AUDIT_ORIGIN: "http://127.0.0.1:5198"
          TEACHER_HARNESS_ORIGIN: "http://127.0.0.1:5188"
        run: node tests/browser/workViewOpenerCover.mjs

      - name: Keep the opener sweep's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-view-opener-cover
          path: tests/browser/artifacts/workViewOpenerCover
          if-no-files-found: ignore
          retention-days: 14
