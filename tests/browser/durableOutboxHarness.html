<!doctype html>
<html><body><p id="ready">Loading durable outbox…</p><script type="module">
/*
 * THE REAL INDEXEDDB HARNESS.
 *
 * tests/platform runs the outbox against an in-memory adapter, and on
 * September 14 that adapter was green while real Chromebook persistence was
 * failing. Everything here therefore runs in a real browser against real
 * IndexedDB, across a real reload: the transaction semantics, the version-2
 * upgrade over a version-1 database, and the guard that decides whether a
 * coalesced row may be deleted are all things the memory adapter cannot get
 * wrong on your behalf.
 */
import {
  createDurableAction,
  drainDurableActions,
  enqueueDurableAction,
  listDurableActions,
  listRetiredDurableActions,
  summarizeDurableOutbox,
} from '/src/platform/performance/durableActionOutbox.js';
import { SUBMISSION_DISPOSITION } from '/functions/shared/studentSubmissionDisposition.mjs';
import {
  nextDeviceReportGeneration,
  resolveDeviceId,
} from '/src/platform/persistence/deviceIdentity.js';
// The real reporter the student runtime uses; only the callable is stubbed.
import { reportDeviceQueueUnlessUnchanged } from '/src/platform/persistence/deviceReportDedupe.js';

const STUDENT = 'browser-cert-student';
const ASSIGNMENT = 'assignment.with`punctuation';

/*
 * WHAT TOUCHES EACH STORE.
 *
 * Every bulk read, cursor and count on an object store or an index is tallied
 * by the store it reads, so the certification can show what a device report
 * costs against real IndexedDB — in particular that, once a tally exists, it
 * never reads the `retired` store at all.
 */
const idbCalls = {};
let countingIdbCalls = true;
const resetIdbCalls = () => {
  Object.keys(idbCalls).forEach((key) => { delete idbCalls[key]; });
  return true;
};
const instrument = (prototype, method, storeNameOf) => {
  const original = prototype[method];
  prototype[method] = function instrumented(...args) {
    if (countingIdbCalls) {
      const key = `${storeNameOf(this)}.${method}`;
      idbCalls[key] = (idbCalls[key] || 0) + 1;
    }
    return original.apply(this, args);
  };
};
['getAll', 'openCursor', 'count'].forEach((method) => {
  instrument(IDBObjectStore.prototype, method, (store) => store.name);
  instrument(IDBIndex.prototype, method, (index) => index.objectStore.name);
});

const openCurrentDatabase = () => new Promise((resolve, reject) => {
  const request = indexedDB.open('mathmaster-student-actions');
  request.onerror = () => reject(request.error);
  request.onsuccess = () => resolve(request.result);
});

/*
 * Write rows STRAIGHT INTO `retired`, the way a release before tallies left
 * them: no tally record is touched. The module opens (and upgrades) the
 * database first, so the store is there to write into.
 */
const seedRetiredRows = async (rows) => {
  await listDurableActions({ studentId: STUDENT });
  const database = await openCurrentDatabase();
  return new Promise((resolve, reject) => {
    const transaction = database.transaction('retired', 'readwrite');
    rows.forEach((row) => transaction.objectStore('retired').put(row));
    transaction.oncomplete = () => { database.close(); resolve(rows.length); };
    transaction.onerror = () => { database.close(); reject(transaction.error); };
  });
};

const SEMESTER_DISPOSITIONS = ['duplicate', 'superseded', 'permanently-invalid', 'duplicate', ''];
const semesterRow = (index) => {
  const owner = index % 5 === 0 ? 'browser-cert-classmate' : STUDENT;
  const row = {
    schemaVersion: 2,
    actionId: `semester-${index}`,
    kind: 'ordinarySubmission',
    studentId: owner,
    assignmentId: index % 3 ? ASSIGNMENT : 'another-assignment',
    questionIndex: index % 30,
    createdAt: 1757000000000 + index,
    createdOrder: (1757000000000 + index) * 1000,
    payload: {
      previousTotalAttempts: 0,
      activityRole: 'classwork',
      record: { totalAttempts: 1, attemptCount: 1, status: 'attempted' },
      // A response worth deserializing, as a real one is.
      response: `${index}:`.padEnd(400, 'x'),
    },
  };
  // One row in eleven predates `retirement` being written at all.
  if (index % 11) {
    row.retirement = { disposition: SEMESTER_DISPOSITIONS[index % SEMESTER_DISPOSITIONS.length], reason: 'seeded', retiredAt: 1757000000000 + index, receipt: null };
  }
  return row;
};

/*
 * THE ORACLE: the summary's retired counts exactly as they were computed
 * before the tally existed — the whole store read and reduced on every
 * summary. Read through raw IndexedDB, not the module, and not counted.
 */
const fullScanRetiredCounts = async (studentId = STUDENT) => {
  const database = await openCurrentDatabase();
  const rows = await new Promise((resolve, reject) => {
    const transaction = database.transaction('retired', 'readonly');
    countingIdbCalls = false;
    const read = transaction.objectStore('retired').getAll();
    countingIdbCalls = true;
    read.onsuccess = () => resolve(read.result || []);
    read.onerror = () => reject(read.error);
  });
  database.close();
  const retired = rows.filter((action) => action && (!studentId || action.studentId === studentId));
  return {
    retired: retired.length,
    retiredByDisposition: retired.reduce(
      (counts, action) => ({ ...counts, [action.retirement?.disposition || 'unknown']: (counts[action.retirement?.disposition || 'unknown'] || 0) + 1 }),
      {},
    ),
  };
};

// The callable, stubbed: it records what would have gone on the wire.
let reportsSentFromThisPage = 0;
let lastWire = null;
const SERVER_ANSWERS = {
  applied: () => ({ success: true, applied: true, ignored: false }),
  ignored: () => ({ success: true, applied: false, ignored: true, reason: 'superseded-by-newer-report' }),
  throw: () => { throw new Error('The server did not answer in time.'); },
};

const action = ({ actionId, kind = 'ordinarySubmission', questionIndex = 0, previous = 0, payload = {} }) =>
  createDurableAction({
    kind,
    studentId: STUDENT,
    assignmentId: ASSIGNMENT,
    questionIndex,
    actionId,
    payload: {
      previousTotalAttempts: previous,
      activityRole: 'classwork',
      record: { totalAttempts: previous + 1, attemptCount: previous + 1, status: 'attempted' },
      ...payload,
    },
  });

/*
 * Write a PR #226-shaped row STRAIGHT INTO the database, bypassing this
 * release's builder entirely. It is the only honest way to prove that a
 * Chromebook which has not been reloaded since the incident can still have its
 * queued work read and delivered: the row has schemaVersion 1, no `delivery`
 * annotation, and none of the fields version 2 added.
 */
const seedLegacyRow = (row) => new Promise((resolve, reject) => {
  const request = indexedDB.open('mathmaster-student-actions');
  request.onerror = () => reject(request.error);
  request.onsuccess = () => {
    const database = request.result;
    const transaction = database.transaction('outbox', 'readwrite');
    transaction.objectStore('outbox').put(row);
    transaction.oncomplete = () => { database.close(); resolve(true); };
    transaction.onerror = () => { database.close(); reject(transaction.error); };
  };
});

/** Create the database at VERSION 1, the way the deployed release left it. */
const createVersionOneDatabase = () => new Promise((resolve, reject) => {
  const request = indexedDB.open('mathmaster-student-actions', 1);
  request.onerror = () => reject(request.error);
  request.onupgradeneeded = () => {
    const database = request.result;
    if (!database.objectStoreNames.contains('outbox')) {
      database.createObjectStore('outbox', { keyPath: 'actionId' }).createIndex('studentId', 'studentId', { unique: false });
    }
  };
  request.onsuccess = () => {
    const database = request.result;
    const version = database.version;
    database.close();
    resolve(version);
  };
});

const deleteDatabase = () => new Promise((resolve) => {
  const request = indexedDB.deleteDatabase('mathmaster-student-actions');
  request.onsuccess = () => resolve(true);
  request.onerror = () => resolve(false);
  request.onblocked = () => resolve(false);
});

window.outboxHarness = {
  SUBMISSION_DISPOSITION,
  reset: deleteDatabase,
  /*
   * Device identity, read through the real module against real IndexedDB. A
   * page reload re-evaluates the module, so its in-memory cache is genuinely
   * gone and only the durable record can answer.
   */
  deviceId: () => resolveDeviceId(),
  reportGeneration: () => nextDeviceReportGeneration(),
  clearDeviceLocalStorage: () => {
    try { window.localStorage.removeItem('mathmaster:device-id'); } catch { /* blocked */ }
    return true;
  },
  createVersionOneDatabase,
  seedLegacyRow,
  enqueue: (actionId, options = {}) => enqueueDurableAction(action({ actionId, ...options })).then((queued) => queued.actionId),
  list: () => listDurableActions({ studentId: STUDENT }),
  listRetired: () => listRetiredDurableActions({ studentId: STUDENT }),
  summary: () => summarizeDurableOutbox({ studentId: STUDENT }),
  /** A first summary and exactly what it read, for two tabs racing to build a tally. */
  summaryWithCalls: async () => {
    resetIdbCalls();
    const summary = await summarizeDurableOutbox({ studentId: STUDENT });
    return { summary, calls: { ...idbCalls } };
  },
  idbCalls: () => ({ ...idbCalls }),
  resetIdbCalls,
  seedSemesterOfRetiredRows: (count) => seedRetiredRows(Array.from({ length: count }, (_, index) => semesterRow(index))),
  /** A tab still on the previous release retiring a row: into `retired`, no tally. */
  retireTheOldWay: (actionId) => seedRetiredRows([{ ...semesterRow(1), actionId, studentId: STUDENT }]),
  fullScanRetiredCounts: (studentId) => fullScanRetiredCounts(studentId),
  /** The real device reporter, with the callable answering as `answer` says. */
  report: async (answer = 'applied') => {
    const result = await reportDeviceQueueUnlessUnchanged({
      studentId: STUDENT,
      transport: async (wire) => {
        reportsSentFromThisPage += 1;
        lastWire = wire;
        return SERVER_ANSWERS[answer]();
      },
    }).catch((error) => ({ failed: String(error?.message || error) }));
    return { result, sentFromThisPage: reportsSentFromThisPage, lastWire };
  },
  captureThenDeliverInBackground: async (actionId, networkDelayMs) => {
    const startedAt = performance.now();
    await enqueueDurableAction(action({ actionId }));
    const advancedAfterMs = performance.now() - startedAt;
    const delivery = drainDurableActions({
      studentId: STUDENT,
      reconcile: () => new Promise((resolve) => setTimeout(
        () => resolve({ disposition: SUBMISSION_DISPOSITION.ACCEPTED }), networkDelayMs,
      )),
    });
    return { advancedAfterMs, delivery };
  },

  /**
   * Drain, reporting which action ids the reconciler saw and WHEN each one
   * finished relative to the start. The timing is what proves a hung question
   * delays only itself — "not blocked" has to mean "not delayed", or a question
   * still waits out another question's whole reconcile timeout.
   */
  drain: (options = {}) => {
    const { script = {}, timeoutMs = 2000, gradeConcurrency } = options;
    const seen = [];
    const settledAfterMs = {};
    const startedAt = performance.now();
    return drainDurableActions({
      studentId: STUDENT,
      timeoutMs,
      ...(gradeConcurrency ? { gradeConcurrency } : {}),
      reconcile: async (queued) => {
        seen.push(queued.actionId);
        const outcome = script[queued.actionId] || script[queued.kind] || { disposition: SUBMISSION_DISPOSITION.ACCEPTED };
        if (outcome === 'throw') throw new Error('reconcile failed');
        if (outcome === 'hang') return new Promise(() => {});
        settledAfterMs[queued.actionId] = performance.now() - startedAt;
        return outcome;
      },
    }).then((result) => ({ ...result, seen, settledAfterMs, totalMs: performance.now() - startedAt }));
  },
};

document.querySelector('#ready').textContent = 'Durable outbox ready';
</script></body></html>
