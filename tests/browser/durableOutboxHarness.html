<!doctype html>
<html><body><p id="ready">Loading durable outbox…</p><script type="module">
import { createDurableAction, drainDurableActions, enqueueDurableAction, listDurableActions } from '/src/platform/performance/durableActionOutbox.js';
window.outboxHarness = {
  enqueue: (actionId) => enqueueDurableAction(createDurableAction({ kind: 'ordinarySubmission', studentId: 'browser-cert-student', assignmentId: 'assignment.with`punctuation', questionIndex: 0, actionId, payload: { previousTotalAttempts: 0, record: { totalAttempts: 1 } } })),
