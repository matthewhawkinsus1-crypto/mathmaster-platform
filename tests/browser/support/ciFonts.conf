<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  CI's fonts on a local machine. A stock Ubuntu runner draws system-ui and
  sans-serif in DejaVu Sans; a machine whose system-ui is Inter draws the same
  text narrower, so a word that clips on CI can fit locally (the Math Tools
  Lab's "Transformations Lab" at 200% text did). Run a large-text check with
  FONTCONFIG_FILE="$PWD/tests/browser/support/ciFonts.conf" (fontconfig wants an
  absolute path) to see what CI sees. "Segoe UI", which the Live Challenge
  rounds name first, is not on the runner, so CI draws it in DejaVu Sans too;
  a machine that maps it to another face would measure those rounds narrower.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Segoe UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
